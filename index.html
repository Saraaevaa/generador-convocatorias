<title>Generador de Convocatorias</title>

<!-- =========================================================
     TIPOGRAFÍAS
     Montserrat = tipografía principal
     Anton = sustituta visual de Extenga 50 Mega
     Archivo Black = sustituta visual de TT Interphases
========================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">


<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
    }

    body {
        background: #eeeeee;
        font-family: "Montserrat", Arial, sans-serif;
        color: #111;
        padding: 25px;
    }


    /* =========================================================
       CONTENEDOR GENERAL
    ========================================================= */

    .pagina {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;

        display: grid;
        grid-template-columns: minmax(420px, 520px) minmax(0, 1fr);
        gap: 35px;

        align-items: start;
    }


    /* =========================================================
       FORMULARIO
    ========================================================= */

    .formulario {
        width: 100%;
        background: white;
        padding: 30px;
        border-radius: 12px;

        box-shadow:
            0 5px 25px rgba(0,0,0,0.08);
    }

    .formulario h1 {
        margin-top: 0;
        margin-bottom: 28px;
        font-size: 30px;
    }

    .formulario h3 {
        margin-top: 30px;
        margin-bottom: 15px;
    }

    .campo-form {
        margin-bottom: 18px;
    }

    .campo-form label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .campo-form input,
    .campo-form select {
        width: 100%;
        padding: 11px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
    }

    .fila {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .jugadores-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 20px;
    }

    .jugador-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .jugador-checkbox input {
        flex-shrink: 0;
    }

    .equipaciones-form {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 7px;
        background: #01408e;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #012f69;
    }


    /* =========================================================
       PREVISUALIZACIÓN
    ========================================================= */

    .previsualizacion {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: sticky;
        top: 25px;
    }

    .convocatoria-wrapper {
        position: relative;
        width: 100%;
        max-width: 560px;
        aspect-ratio: 9 / 16;
        overflow: hidden;

        box-shadow:
            0 10px 40px rgba(0,0,0,0.18);

        background: white;
    }


    /* =========================================================
       CONVOCATORIA REAL
       SIEMPRE 1080 x 1920
    ========================================================= */

    .convocatoria {
        position: absolute;
        left: 0;
        top: 0;

        width: 1080px;
        height: 1920px;

        background: white;
        overflow: hidden;

        display: flex;
        flex-direction: column;

        transform-origin: top left;
    }


    /* =========================================================
       CABECERA AZUL
    ========================================================= */

    .cabecera-azul {
        height: 720px;
        min-height: 720px;

        background: #01408e;
        color: white;

        text-align: center;
        position: relative;

        padding: 42px 55px 0;

        z-index: 2;
    }


    /* =========================================================
       JORNADA / AMISTOSO
       CANVA: MONTSERRAT 27,7 BOLD
    ========================================================= */

    .jornada-capsula {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-width: 430px;
        height: 70px;

        padding: 0 48px;

        background: white;
        color: #111;

        border-radius: 38px;

        font-family: "Montserrat", Arial, sans-serif;
        font-size: 27.7px;
        font-weight: 700;

        letter-spacing: 2px;

        margin-bottom: 18px;
    }


    /* =========================================================
       FECHA
       CANVA: MONTSERRAT 24 BOLD
    ========================================================= */

    .fecha {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 1.5px;

        margin-bottom: 13px;
    }


    /* =========================================================
       CAMPO / LUGAR
       CANVA: MONTSERRAT 24 REGULAR
    ========================================================= */

    .campo {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 400;

        letter-spacing: 1.5px;

        margin-bottom: 37px;

        text-transform: uppercase;

        white-space: nowrap;
    }

    .icono-ubicacion {
        display: inline-block;

        font-size: 0;

        width: 20px;
        height: 25px;

        margin-right: 8px;

        position: relative;

        vertical-align: -5px;
    }

    .icono-ubicacion::before {
        content: '';

        position: absolute;

        width: 16px;
        height: 16px;

        left: 2px;
        top: 1px;

        border: 3px solid white;

        border-radius: 50% 50% 50% 0;

        transform: rotate(-45deg);
    }

    .icono-ubicacion::after {
        content: '';

        position: absolute;

        width: 5px;
        height: 5px;

        left: 7.5px;
        top: 6.5px;

        background: white;

        border-radius: 50%;
    }


    /* =========================================================
       CONVOCATORIA
       CANVA: EXTENGA 50 MEGA 157
       SUSTITUTA: ANTON
    ========================================================= */

    .titulo-convocatoria {
        font-family: "Anton", Impact, sans-serif;

        font-size: 157px;
        font-weight: 400;

        line-height: 0.84;

        letter-spacing: 0;

        margin-bottom: 13px;

        white-space: nowrap;

        transform: scaleX(.91);
    }


    /* =========================================================
       CATEGORÍA
       CANVA: MONTSERRAT 24
    ========================================================= */

    .categoria {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 400;

        letter-spacing: 1.5px;

        text-transform: uppercase;

        margin-bottom: 34px;
    }


    /* =========================================================
       ENFRENTAMIENTO
    ========================================================= */

    .enfrentamiento {
        width: 720px;
        height: 176px;

        margin: 0 auto;

        background: white;

        border-radius: 90px;

        color: #111;

        padding: 10px 34px;

        position: relative;
    }

    .equipos {
        height: 100%;

        display: grid;

        grid-template-columns: 1fr 90px 1fr;

        align-items: center;

        gap: 5px;
    }

    .equipo {
        height: 100%;

        display: flex;

        align-items: center;

        justify-content: center;
    }

    .equipo img {
        width: 132px;
        height: 132px;

        object-fit: contain;
    }


    /* =========================================================
       VS
       CANVA: MONTSERRAT 24 BOLD
    ========================================================= */

    .vs {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 700;

        letter-spacing: 0;
    }


    /* =========================================================
       NOMBRES EQUIPOS
       CANVA: MONTSERRAT 24
    ========================================================= */

    .nombres-equipos {
        width: 870px;
        max-width: 100%;

        margin: 15px auto 0;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 70px;
    }

    .nombre-equipo {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 400;

        letter-spacing: 1.2px;

        text-transform: uppercase;

        white-space: nowrap;
    }

    .nombre-equipo.izquierda {
        text-align: left;
    }

    .nombre-equipo.derecha {
        text-align: right;
    }


    /* =========================================================
       DIAGONAL AZUL / BLANCO
    ========================================================= */

    .cabecera-azul::after {
        content: "";

        position: absolute;

        left: -2%;
        right: -2%;

        bottom: -27px;

        height: 55px;

        background: white;

        transform: rotate(-1.7deg);

        transform-origin: center;
    }


    /* =========================================================
       ZONA BLANCA
    ========================================================= */

    .zona-blanca {
        flex: 1;

        background: white;

        position: relative;

        z-index: 1;

        padding: 55px 78px 22px;

        display: flex;
        flex-direction: column;

        min-height: 0;
    }

    .lista-jugadores {
        display: grid;

        grid-template-columns: 1fr 1fr;

        column-gap: 70px;

        flex: 1;

        min-height: 0;
    }

    .columna-jugadores {
        display: flex;
        flex-direction: column;
    }

    .grupo-posicion {
        margin-bottom: 21px;
    }


    /* =========================================================
       POSICIONES
       CANVA: MONTSERRAT 22,8 BOLD
    ========================================================= */

    .titulo-posicion {
        color: #064691;

        font-family: "Montserrat", Arial, sans-serif;

        font-size: 22.8px;
        font-weight: 700;

        letter-spacing: 1px;

        margin-bottom: 7px;

        text-transform: uppercase;
    }

    .jugador {
        display: grid;

        grid-template-columns: 58px 1fr;

        align-items: center;

        min-height: 54px;
    }


    /* =========================================================
       DORSALES
       CANVA: TT INTERPHASES 29,4 BOLD
       SUSTITUTA: ARCHIVO BLACK
    ========================================================= */

    .dorsal {
        color: #f12691;

        font-family: "Archivo Black", Arial, sans-serif;

        font-size: 29.4px;
        font-weight: 400;

        text-align: center;

        line-height: 1;
    }


    /* =========================================================
       NOMBRES JUGADORES
       CANVA: MONTSERRAT 29,6 BOLD
    ========================================================= */

    .nombre-jugador {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 29.6px;
        font-weight: 700;

        text-transform: uppercase;

        line-height: 1.02;

        white-space: nowrap;

        letter-spacing: 0;
    }


    /* =========================================================
       STAFF
    ========================================================= */

    .staff {
        text-align: center;

        margin-top: auto;

        padding-top: 6px;

        padding-bottom: 2px;
    }


    /* =========================================================
       ENTRENADOR / CUERPO TÉCNICO
       CANVA: MONTSERRAT 18,2 BOLD
    ====
```
