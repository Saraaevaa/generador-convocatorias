<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Convocatorias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        /* =========================
           FORMULARIO
        ========================= */

        .formulario {
            max-width: 900px;
            margin: 0 auto 40px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .formulario h1 {
            margin-top: 0;
        }

        .campo-form {
            margin-bottom: 18px;
        }

        .campo-form label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .campo-form input,
        .campo-form select {
            width: 100%;
            padding: 11px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .jugadores-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
        }

        .jugador-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .equipaciones-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #01408e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #012f69;
        }


        /* =========================
           CONVOCATORIA
           1080 x 1920
        ========================= */

        .convocatoria {
            width: 1080px;
            height: 1920px;
            max-width: 100%;
            margin: 0 auto;
            background: white;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.18);
        }


        /* =========================
           PARTE AZUL SUPERIOR
        ========================= */

        .cabecera-azul {
            background: #01408e;
            color: white;
            padding: 42px 55px 45px;
            text-align: center;
        }

        .tipo-partido {
            display: inline-block;
            background: white;
            color: #01408e;
            font-size: 28px;
            font-weight: 800;
            padding: 12px 45px;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .fecha {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .campo {
            font-size: 25px;
            font-weight: 400;
            margin-bottom: 42px;
        }

        .titulo-convocatoria {
            font-size: 72px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 13px;
        }

        .categoria {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 42px;
        }


        /* =========================
           ESCUDOS
        ========================= */

        .enfrentamiento {
            position: relative;
            width: 760px;
            max-width: 100%;
            margin: 0 auto;
            padding: 35px 45px 30px;

            background: rgba(255,255,255,0.13);
            border: 2px solid rgba(255,255,255,0.65);
            border-radius: 55px;
        }

        .equipos {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            align-items: center;
            gap: 20px;
        }

        .equipo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .equipo img {
            width: 155px;
            height: 155px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .nombre-equipo {
            font-size: 25px;
            font-weight: 800;
            line-height: 1.15;
        }

        .vs {
            font-size: 45px;
            font-weight: 900;
        }


        /* =========================
           ZONA BLANCA
        ========================= */

        .zona-blanca {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            padding: 38px 65px 25px;
            min-height: 0;
        }

        .titulo-seccion {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: #01408e;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .lista-jugadores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 65px;
            row-gap: 12px;
        }

        .jugador {
            display: grid;
            grid-template-columns: 65px 1fr;
            align-items: center;
            min-height: 68px;
            border-bottom: 1px solid #dedede;
        }

        .dorsal {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #01408e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
        }

        .nombre-jugador {
            font-size: 24px;
            font-weight: 700;
        }


        /* =========================
           CUERPO TÉCNICO
        ========================= */

        .staff {
            margin-top: auto;
            padding-top: 30px;
        }

        .staff-titulo {
            color: #01408e;
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .staff-nombre {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .staff-nombre strong {
            font-weight: 800;
        }


        /* =========================
           BANNER INFERIOR
        ========================= */

        .pie-azul {
            height: 290px;
            min-height: 290px;
            background: #01408e;
            color: white;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;

            padding: 25px 55px;
        }


        /* EQUIPACIÓN */

        .equipacion-pie {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .equipacion-titulo {
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .kit-visual {
            position: relative;
            height: 200px;
            width: 390px;
        }

        .pieza-kit {
            position: absolute;
            object-fit: contain;
        }

        .camiseta-kit {
            width: 150px;
            height: 150px;
            left: 0;
            top: 15px;
        }

        .pantalon-kit {
            width: 115px;
            height: 115px;
            left: 130px;
            top: 70px;
        }

        .medias-kit {
            width: 105px;
            height: 105px;
            left: 255px;
            top: 55px;
        }


        /* HORARIOS */

        .horarios {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
        }

        .hora-bloque {
            margin-bottom: 22px;
        }

        .hora-titulo {
            font-size: 21px;
            font-weight: 700;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .hora {
            font-size: 43px;
            font-weight: 900;
            line-height: 1;
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                padding: 20px;
            }

            .fila {
                grid-template-columns: 1fr;
            }

            .jugadores-form {
                grid-template-columns: 1fr;
            }

            .equipaciones-form {
                grid-template-columns: 1fr;
            }

            .convocatoria {
                width: 100%;
                height: auto;
                aspect-ratio: 9 / 16;
            }

            .cabecera-azul {
                padding: 22px 18px 25px;
            }

            .tipo-partido {
                font-size: 14px;
                padding: 7px 22px;
                margin-bottom: 15px;
            }

            .fecha {
                font-size: 17px;
                margin-bottom: 8px;
            }

            .campo {
                font-size: 13px;
                margin-bottom: 18px;
            }

            .titulo-convocatoria {
                font-size: 36px;
            }

            .categoria {
                font-size: 15px;
                margin-bottom: 20px;
            }

            .enfrentamiento {
                width: 100%;
                padding: 16px;
                border-radius: 28px;
            }

            .equipos {
                grid-template-columns: 1fr 45px 1fr;
                gap: 5px;
            }

            .equipo img {
                width: 65px;
                height: 65px;
            }

            .nombre-equipo {
                font-size: 11px;
            }

            .vs {
                font-size: 20px;
            }

            .zona-blanca {
                padding: 18px 20px 12px;
            }

            .titulo-seccion {
                font-size: 17px;
                margin-bottom: 12px;
            }

            .lista-jugadores {
                column-gap: 15px;
                row-gap: 4px;
            }

            .jugador {
                grid-template-columns: 27px 1fr;
                min-height: 32px;
            }

            .dorsal {
                width: 24px;
                height: 24px;
                font-size: 10px;
            }

            .nombre-jugador {
                font-size: 10px;
            }

            .staff {
                padding-top: 10px;
            }

            .staff-titulo {
                font-size: 12px;
                margin-bottom: 4px;
            }

            .staff-nombre {
                font-size: 10px;
                margin-bottom: 2px;
            }

            .pie-azul {
                height: 115px;
                min-height: 115px;
                padding: 10px 15px;
            }

            .equipacion-titulo {
                font-size: 11px;
            }

            .kit-visual {
                width: 190px;
                height: 85px;
            }

            .camiseta-kit {
                width: 65px;
                height: 65px;
                left: 0;
            }

            .pantalon-kit {
                width: 50px;
                height: 50px;
                left: 58px;
                top: 30px;
            }

            .medias-kit {
                width: 48px;
                height: 48px;
                left: 110px;
                top: 25px;
            }

            .hora-titulo {
                font-size: 9px;
            }

            .hora {
                font-size: 18px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         FORMULARIO
    ========================= -->

    <div class="formulario">

        <h1>Generador de convocatorias</h1>

        <div class="campo-form">
            <label for="equipo">Equipo</label>
            <select id="equipo"></select>
        </div>

        <div class="fila">

            <div class="campo-form">
                <label for="tipoPartido">Tipo de partido</label>

                <select id="tipoPartido">
                    <option value="oficial">Partido oficial</option>
                    <option value="amistoso">Amistoso</option>
                </select>
            </div>

            <div class="campo-form">
                <label for="jornada">Jornada</label>
                <input
                    type="number"
                    id="jornada"
                    min="1"
                    placeholder="Ej. 12">
            </div>

        </div>


        <div class="fila">

            <div class="campo-form">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha">
            </div>

            <div class="campo-form">
                <label for="horaPartido">Hora del partido</label>
                <input type="time" id="horaPartido">
            </div>

        </div>


        <div class="campo-form">
            <label for="horaConvocatoria">Hora de convocatoria</label>
            <input type="time" id="horaConvocatoria">
        </div>


        <div class="campo-form">
            <label for="rival">Rival</label>
            <select id="rival"></select>
        </div>


        <div class="campo-form">
            <label for="localVisitante">Las Rozas</label>

            <select id="localVisitante">
                <option value="local">Local</option>
                <option value="visitante">Visitante</option>
            </select>
        </div>


        <div class="fila">

            <div class="campo-form">
                <label for="campo">Campo</label>
                <input
                    type="text"
                    id="campo"
                    placeholder="Ej. Campo de fútbol">
            </div>

            <div class="campo-form">
                <label for="lugar">Lugar</label>
                <input
                    type="text"
                    id="lugar"
                    placeholder="Ej. Torrelodones">
            </div>

        </div>


        <h3>Jugadores convocados</h3>

        <div
            id="jugadoresForm"
            class="jugadores-form">
        </div>


        <h3>Equipación</h3>

        <div class="equipaciones-form">

            <div class="campo-form">
                <label for="camiseta">Camiseta</label>
                <select id="camiseta"></select>
            </div>

            <div class="campo-form">
                <label for="pantalon">Pantalón</label>
                <select id="pantalon"></select>
            </div>

            <div class="campo-form">
                <label for="medias">Medias</label>
                <select id="medias"></select>
            </div>

        </div>


        <button onclick="generarConvocatoria()">
            Generar convocatoria
        </button>

    </div>



    <!-- =========================
         CONVOCATORIA
    ========================= -->

    <div
        id="convocatoria"
        class="convocatoria">


        <!-- CABECERA AZUL -->

        <div class="cabecera-azul">

            <div
                id="tipoPartidoVisual"
                class="tipo-partido">
                PARTIDO OFICIAL
            </div>

            <div
                id="fechaVisual"
                class="fecha">
                sábado 16 de julio
            </div>

            <div
                id="campoVisual"
                class="campo">
                📍 Campo (Lugar)
            </div>

            <div class="titulo-convocatoria">
                CONVOCATORIA
            </div>

            <div
                id="categoriaVisual"
                class="categoria">
                Cadete B (Autonómica)
            </div>


            <div class="enfrentamiento">

                <div class="equipos">

                    <div class="equipo">

                        <img
                            id="escudoLocal"
                            src="escudos/Las_Rozas.png"
                            alt="Las Rozas">

                        <div
                            id="nombreLocal"
                            class="nombre-equipo">
                            Las Rozas
                        </div>

                    </div>


                    <div class="vs">
                        VS
                    </div>


                    <div class="equipo">

                        <img
                            id="escudoVisitante"
                            src="escudos/Fundación_ADF.png"
                            alt="Fundación ADF">

                        <div
                            id="nombreVisitante"
                            class="nombre-equipo">
                            Fundación ADF
                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- ZONA BLANCA -->

        <div class="zona-blanca">

            <div class="titulo-seccion">
                CONVOCADOS
            </div>


            <div
                id="listaJugadores"
                class="lista-jugadores">
            </div>


            <div class="staff">

                <div class="staff-titulo">
                    CUERPO TÉCNICO
                </div>

                <div
                    id="entrenadorVisual"
                    class="staff-nombre">
                    <strong>Entrenador:</strong>
                    Entrenador de prueba
                </div>

                <div
                    id="cuerpoTecnicoVisual">
                </div>

            </div>

        </div>



        <!-- PIE AZUL -->

        <div class="pie-azul">


            <!-- EQUIPACIÓN -->

            <div class="equipacion-pie">

                <div class="equipacion-titulo">
                    EQUIPACIÓN
                </div>

                <div class="kit-visual">

                    <img
                        id="camisetaVisual"
                        class="pieza-kit camiseta-kit"
                        src=""
                        alt="Camiseta">

                    <img
                        id="pantalonVisual"
                        class="pieza-kit pantalon-kit"
                        src=""
                        alt="Pantalón">

                    <img
                        id="mediasVisual"
                        class="pieza-kit medias-kit"
                        src=""
                        alt="Medias">

                </div>

            </div>


            <!-- HORARIOS -->

            <div class="horarios">

                <div class="hora-bloque">

                    <div class="hora-titulo">
                        HORA DEL PARTIDO
                    </div>

                    <div
                        id="horaPartidoVisual"
                        class="hora">
                        18:30
                    </div>

                </div>


                <div class="hora-bloque">

                    <div class="hora-titulo">
                        HORA DE CONVOCATORIA
                    </div>

                    <div
                        id="horaConvocatoriaVisual"
                        class="hora">
                        17:45
                    </div>

                </div>

            </div>

        </div>

    </div>



    <script src="datos.js"></script>

    <script>

        /* =========================
           REFERENCIAS
        ========================= */

        const equipoSelect =
            document.getElementById("equipo");

        const tipoPartidoSelect =
            document.getElementById("tipoPartido");

        const jornadaInput =
            document.getElementById("jornada");

        const fechaInput =
            document.getElementById("fecha");

        const horaPartidoInput =
            document.getElementById("horaPartido");

        const horaConvocatoriaInput =
            document.getElementById("horaConvocatoria");

        const rivalSelect =
            document.getElementById("rival");

        const localVisitanteSelect =
            document.getElementById("localVisitante");

        const campoInput =
            document.getElementById("campo");

        const lugarInput =
            document.getElementById("lugar");

        const jugadoresForm =
            document.getElementById("jugadoresForm");

        const camisetaSelect =
            document.getElementById("camiseta");

        const pantalonSelect =
            document.getElementById("pantalon");

        const mediasSelect =
            document.getElementById("medias");


        /* =========================
           CARGAR EQUIPOS
        ========================= */

        equipos.forEach(equipo => {

            const option =
                document.createElement("option");

            option.value = equipo.id;
            option.textContent = equipo.nombre;

            equipoSelect.appendChild(option);

        });


        /* =========================
           CARGAR RIVALES
        ========================= */

        function cargarRivales() {

            rivalSelect.innerHTML = "";

            const equipoId =
                equipoSelect.value;

            rivales
                .filter(rival =>
                    rival.equipos.includes(equipoId)
                )
                .forEach(rival => {

                    const option =
                        document.createElement("option");

                    option.value = rival.id;
                    option.textContent = rival.nombre;

                    rivalSelect.appendChild(option);

                });

        }


        /* =========================
           CARGAR JUGADORES
        ========================= */

        function cargarJugadores() {

            jugadoresForm.innerHTML = "";

            const equipo =
                equipos.find(
                    e => e.id === equipoSelect.value
                );

            if (!equipo) return;


            equipo.jugadores.forEach(
                (jugador, index) => {

                    const label =
                        document.createElement("label");

                    label.className =
                        "jugador-checkbox";


                    const checkbox =
                        document.createElement("input");

                    checkbox.type = "checkbox";
                    checkbox.value = index;
                    checkbox.dataset.dorsal =
                        jugador.dorsal;


                    const texto =
                        document.createElement("span");

                    texto.textContent =
                        `${jugador.dorsal} - ${jugador.nombre}`;


                    label.appendChild(checkbox);
                    label.appendChild(texto);

                    jugadoresForm.appendChild(label);

                }
            );

        }


        /* =========================
           CARGAR EQUIPACIONES
        ========================= */

        function cargarEquipacion() {

            const equipo =
                equipaciones.find(
                    e =>
                        e.equipoId ===
                        equipoSelect.value
                );

            if (!equipo) return;


            camisetaSelect.innerHTML = "";
            pantalonSelect.innerHTML = "";
            mediasSelect.innerHTML = "";


            equipo.camiseta.forEach(
                (item, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;
                    option.textContent =
                        item.nombre;

                    camisetaSelect.appendChild(option);

                }
            );


            equipo.pantalon.forEach(
                (item, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;
                    option.textContent =
                        item.nombre;

                    pantalonSelect.appendChild(option);

                }
            );


            equipo.medias.forEach(
                (item, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;
                    option.textContent =
                        item.nombre;

                    mediasSelect.appendChild(option);

                }
            );

        }


        /* =========================
           CAMBIO DE EQUIPO
        ========================= */

        equipoSelect.addEventListener(
            "change",
            () => {

                cargarRivales();
                cargarJugadores();
                cargarEquipacion();

            }
        );


        /* =========================
           FORMATO FECHA
        ========================= */

        function formatearFecha(fecha) {

            if (!fecha) {
                return "";
            }

            const partes =
                fecha.split("-");

            const fechaObj =
                new Date(
                    partes[0],
                    partes[1] - 1,
                    partes[2]
                );

            const dias = [
                "domingo",
                "lunes",
                "martes",
                "miércoles",
                "jueves",
                "viernes",
                "sábado"
            ];

            const meses = [
                "enero",
                "febrero",
                "marzo",
                "abril",
                "mayo",
                "junio",
                "julio",
                "agosto",
                "septiembre",
                "octubre",
                "noviembre",
                "diciembre"
            ];

            return `${dias[fechaObj.getDay()]} ${fechaObj.getDate()} de ${meses[fechaObj.getMonth()]}`;

        }


        /* =========================
           GENERAR
        ========================= */

        function generarConvocatoria() {

            const equipo =
                equipos.find(
                    e => e.id === equipoSelect.value
                );

            const rival =
                rivales.find(
                    r => r.id === rivalSelect.value
                );


            /* TIPO */

            const tipo =
                tipoPartidoSelect.value;

            document.getElementById(
                "tipoPartidoVisual"
            ).textContent =
                tipo === "amistoso"
                    ? "AMISTOSO"
                    : "PARTIDO OFICIAL";


            /* FECHA */

            document.getElementById(
                "fechaVisual"
            ).textContent =
                formatearFecha(
                    fechaInput.value
                );


            /* CAMPO */

            const campo =
                campoInput.value.trim();

            const lugar =
                lugarInput.value.trim();

            let campoTexto = "";

            if (campo && lugar) {
                campoTexto =
                    `📍 ${campo} (${lugar})`;
            }
            else if (campo) {
                campoTexto =
                    `📍 ${campo}`;
            }
            else if (lugar) {
                campoTexto =
                    `📍 ${lugar}`;
            }

            document.getElementById(
                "campoVisual"
            ).textContent =
                campoTexto;


            /* EQUIPO */

            document.getElementById(
                "categoriaVisual"
            ).textContent =
                `${equipo.nombre} (Autonómica)`;


            /* RIVAL */

            const esLocal =
                localVisitanteSelect.value ===
                "local";


            const escudoLocal =
                document.getElementById(
                    "escudoLocal"
                );

            const escudoVisitante =
                document.getElementById(
                    "escudoVisitante"
                );

            const nombreLocal =
                document.getElementById(
                    "nombreLocal"
                );

            const nombreVisitante =
                document.getElementById(
                    "nombreVisitante"
                );


            if (esLocal) {

                escudoLocal.src =
                    "escudos/Las_Rozas.png";

                nombreLocal.textContent =
                    "Las Rozas";

                escudoVisitante.src =
                    rival.escudo;

                nombreVisitante.textContent =
                    rival.nombre;

            }
            else {

                escudoLocal.src =
                    rival.escudo;

                nombreLocal.textContent =
                    rival.nombre;

                escudoVisitante.src =
                    "escudos/Las_Rozas.png";

                nombreVisitante.textContent =
                    "Las Rozas";

            }


            /* JUGADORES */

            const checkboxes =
                jugadoresForm.querySelectorAll(
                    "input[type='checkbox']:checked"
                );

            const lista =
                document.getElementById(
                    "listaJugadores"
                );

            lista.innerHTML = "";


            checkboxes.forEach(
                checkbox => {

                    const jugador =
                        equipo.jugadores[
                            Number(
                                checkbox.value
                            )
                        ];


                    const elemento =
                        document.createElement(
                            "div"
                        );

                    elemento.className =
                        "jugador";


                    const dorsal =
                        document.createElement(
                            "div"
                        );

                    dorsal.className =
                        "dorsal";

                    dorsal.textContent =
                        jugador.dorsal;


                    const nombre =
                        document.createElement(
                            "div"
                        );

                    nombre.className =
                        "nombre-jugador";

                    nombre.textContent =
                        jugador.nombre;


                    elemento.appendChild(
                        dorsal
                    );

                    elemento.appendChild(
                        nombre
                    );

                    lista.appendChild(
                        elemento
                    );

                }
            );


            /* STAFF */

            document.getElementById(
                "entrenadorVisual"
            ).innerHTML =
                `<strong>Entrenador:</strong> ${equipo.entrenador}`;


            const cuerpoTecnico =
                document.getElementById(
                    "cuerpoTecnicoVisual"
                );

            cuerpoTecnico.innerHTML = "";


            if (
                equipo.cuerpoTecnico &&
                equipo.cuerpoTecnico.length
            ) {

                equipo.cuerpoTecnico.forEach(
                    persona => {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "staff-nombre";

                        div.innerHTML =
                            `<strong>Ayudante:</strong> ${persona}`;

                        cuerpoTecnico.appendChild(
                            div
                        );

                    }
                );

            }


            /* EQUIPACIÓN */

            const datosEquipacion =
                equipaciones.find(
                    e =>
                        e.equipoId ===
                        equipo.id
                );


            const camiseta =
                datosEquipacion.camiseta[
                    Number(
                        camisetaSelect.value
                    )
                ];

            const pantalon =
                datosEquipacion.pantalon[
                    Number(
                        pantalonSelect.value
                    )
                ];

            const medias =
                datosEquipacion.medias[
                    Number(
                        mediasSelect.value
                    )
                ];


            document.getElementById(
                "camisetaVisual"
            ).src =
                camiseta.imagen;


            document.getElementById(
                "pantalonVisual"
            ).src =
                pantalon.imagen;


            document.getElementById(
                "mediasVisual"
            ).src =
                medias.imagen;


            /* HORARIOS */

            document.getElementById(
                "horaPartidoVisual"
            ).textContent =
                horaPartidoInput.value ||
                "--:--";


            document.getElementById(
                "horaConvocatoriaVisual"
            ).textContent =
                horaConvocatoriaInput.value ||
                "--:--";

        }


        /* =========================
           INICIO
        ========================= */

        cargarRivales();
        cargarJugadores();
        cargarEquipacion();

    </script>

</body>
</html>
