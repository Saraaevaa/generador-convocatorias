<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Convocatorias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .bloque {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #generar {
            width: 100%;
            background: #111;
            color: white;
            font-size: 16px;
        }

        .jugador {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .jugador input {
            width: auto;
        }

        .contador {
            margin-top: 15px;
            font-weight: bold;
        }

        .equipacion-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .equipacion-item {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
        }

        #resultado {
            display: none;
        }

        .partido {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .equipos-partido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .equipo-partido {
            flex: 1;
        }

        .equipo-partido img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .equipo-nombre {
            font-size: 22px;
            font-weight: bold;
        }

        .datos-partido {
            margin-top: 25px;
            text-align: center;
            font-size: 16px;
        }

        .lista-final {
            margin-top: 25px;
        }

        .lista-final li {
            margin-bottom: 5px;
        }

        .tecnico-final {
            margin-top: 25px;
        }

        @media (max-width: 700px) {
            .equipacion-grid {
                grid-template-columns: 1fr;
            }

            .equipos-partido {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Generador de Convocatorias</h1>

    <div class="bloque">

        <label for="equipo">Equipo</label>
        <select id="equipo">
            <option value="">Selecciona un equipo</option>
        </select>

        <label for="tipoPartido">Tipo de partido</label>
        <select id="tipoPartido">
            <option value="oficial">Partido oficial</option>
            <option value="amistoso">Amistoso</option>
        </select>

        <label for="jornada">Jornada</label>
        <select id="jornada">
            <option value="">Selecciona jornada</option>
        </select>

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">

        <label for="rival">Rival</label>
        <select id="rival">
            <option value="">Selecciona un rival</option>
        </select>

        <label for="campo">Campo</label>
        <input type="text" id="campo" placeholder="Ej.: Campo de fútbol">

        <label for="lugar">Lugar</label>
        <input type="text" id="lugar" placeholder="Ej.: Torrelodones">

        <label for="localVisitante">Situación</label>
        <select id="localVisitante">
            <option value="local">Local</option>
            <option value="visitante">Visitante</option>
        </select>

    </div>

    <div class="bloque">

        <h2>Jugadores convocados</h2>

        <div id="listaJugadores"></div>

        <div class="contador">
            Convocados: <span id="contador">0</span>
        </div>

    </div>

    <div class="bloque">

        <h2>Equipación</h2>

        <div class="equipacion-grid">

            <div class="equipacion-item">
                <label for="camiseta">Camiseta</label>
                <select id="camiseta"></select>
            </div>

            <div class="equipacion-item">
                <label for="pantalon">Pantalón</label>
                <select id="pantalon"></select>
            </div>

            <div class="equipacion-item">
                <label for="medias">Medias</label>
                <select id="medias"></select>
            </div>

        </div>

    </div>

    <div class="bloque">
        <button id="generar">Generar convocatoria</button>
    </div>

    <div id="resultado" class="bloque">

        <h2>Convocatoria generada</h2>

        <div class="partido">

            <div class="equipos-partido">

                <div id="equipoIzquierda" class="equipo-partido"></div>

                <div>
                    <strong>VS</strong>
                </div>

                <div id="equipoDerecha" class="equipo-partido"></div>

            </div>

            <div class="datos-partido">

                <div id="infoJornada"></div>
                <div id="infoFecha"></div>
                <div id="infoCampo"></div>
                <div id="infoEquipacion"></div>

            </div>

            <div class="lista-final">

                <h3>Jugadores convocados</h3>

                <ol id="listaFinalJugadores"></ol>

            </div>

            <div class="tecnico-final">

                <h3>Entrenador</h3>
                <div id="entrenadorFinal"></div>

                <h3>Cuerpo técnico</h3>
                <ul id="cuerpoTecnicoFinal"></ul>
            </div>

        </div>

    </div>

    <script src="datos.js"></script>

    <script>

        const equipoSelect = document.getElementById("equipo");
        const tipoPartido = document.getElementById("tipoPartido");
        const jornadaSelect = document.getElementById("jornada");
        const rivalSelect = document.getElementById("rival");
        const fechaInput = document.getElementById("fecha");
        const localVisitante = document.getElementById("localVisitante");

        const listaJugadores = document.getElementById("listaJugadores");
        const contador = document.getElementById("contador");

        const camisetaSelect = document.getElementById("camiseta");
        const pantalonSelect = document.getElementById("pantalon");
        const mediasSelect = document.getElementById("medias");

        let equipoActual = null;


        // =========================
        // CARGAR EQUIPOS
        // =========================

        equipos.forEach(equipo => {

            const option = document.createElement("option");

            option.value = equipo.id;
            option.textContent = equipo.nombre;

            equipoSelect.appendChild(option);

        });


        // =========================
        // JORNADAS
        // =========================

        for (let i = 1; i <= 30; i++) {

            const option = document.createElement("option");

            option.value = i;
            option.textContent = "Jornada " + i;

            jornadaSelect.appendChild(option);

        }


        // =========================
        // CAMBIO DE EQUIPO
        // =========================

        equipoSelect.addEventListener("change", () => {

            equipoActual = equipos.find(
                equipo => equipo.id === equipoSelect.value
            );

            cargarRivales();
            cargarJugadores();
            cargarEquipacion();

        });


        // =========================
        // CAMBIO TIPO PARTIDO
        // =========================

        tipoPartido.addEventListener("change", () => {

            if (tipoPartido.value === "amistoso") {

                jornadaSelect.disabled = true;
                jornadaSelect.value = "";

            } else {

                jornadaSelect.disabled = false;

            }

        });


        // =========================
        // CARGAR RIVALES
        // =========================

        function cargarRivales() {

            rivalSelect.innerHTML =
                '<option value="">Selecciona un rival</option>';

            if (!equipoActual) return;

            const rivalesEquipo = rivales.filter(rival =>
                rival.equipos.includes(equipoActual.id)
            );

            rivalesEquipo.forEach(rival => {

                const option = document.createElement("option");

                option.value = rival.id;
                option.textContent = rival.nombre;

                rivalSelect.appendChild(option);

            });

        }


        // =========================
        // CARGAR JUGADORES
        // =========================

        function cargarJugadores() {

            listaJugadores.innerHTML = "";
            contador.textContent = "0";

            if (!equipoActual) return;

            equipoActual.jugadores.forEach((jugador, indice) => {

                const div = document.createElement("div");

                div.className = "jugador";

                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.value = indice;

                checkbox.addEventListener("change", actualizarContador);

                const texto = document.createElement("span");

                const posiciones = jugador.posiciones
                    .filter(pos => pos)
                    .join(" / ");

                texto.textContent =
                    jugador.dorsal +
                    " - " +
                    jugador.nombre +
                    (posiciones ? " (" + posiciones + ")" : "");

                div.appendChild(checkbox);
                div.appendChild(texto);

                listaJugadores.appendChild(div);

            });

        }


        // =========================
        // CONTADOR
        // =========================

        function actualizarContador() {

            const seleccionados =
                listaJugadores.querySelectorAll(
                    'input[type="checkbox"]:checked'
                );

            contador.textContent = seleccionados.length;

        }


        // =========================
        // CARGAR EQUIPACIÓN
        // =========================

        function cargarEquipacion() {

            camisetaSelect.innerHTML = "";
            pantalonSelect.innerHTML = "";
            mediasSelect.innerHTML = "";

            if (!equipoActual) return;

            const datosEquipacion = equipaciones.find(
                equipacion =>
                    equipacion.equipoId === equipoActual.id
            );

            if (!datosEquipacion) return;

            datosEquipacion.camiseta.forEach(item => {

                const option = document.createElement("option");

                option.value = item.nombre;
                option.textContent =
                    item.nombre + " - " + item.color;

                camisetaSelect.appendChild(option);

            });

            datosEquipacion.pantalon.forEach(item => {

                const option = document.createElement("option");

                option.value = item.nombre;
                option.textContent =
                    item.nombre + " - " + item.color;

                pantalonSelect.appendChild(option);

            });

            datosEquipacion.medias.forEach(item => {

                const option = document.createElement("option");

                option.value = item.nombre;
                option.textContent =
                    item.nombre + " - " + item.color;

                mediasSelect.appendChild(option);

            });

        }


        // =========================
        // GENERAR CONVOCATORIA
        // =========================

        document.getElementById("generar")
            .addEventListener("click", generarConvocatoria);


        function generarConvocatoria() {

            if (!equipoActual) {

                alert("Selecciona un equipo.");

                return;

            }


            const rivalId = rivalSelect.value;

            if (!rivalId) {

                alert("Selecciona un rival.");

                return;

            }


            const rivalActual = rivales.find(
                rival => rival.id === rivalId
            );


            const seleccionados =
                Array.from(
                    listaJugadores.querySelectorAll(
                        'input[type="checkbox"]:checked'
                    )
                );


            const limite =
                tipoPartido.value === "oficial"
                    ? configuracion.convocadosOficial
                    : equipoActual.totalJugadores;


            if (seleccionados.length === 0) {

                alert("Selecciona los jugadores convocados.");

                return;

            }


            if (
                tipoPartido.value === "oficial" &&
                seleccionados.length !== configuracion.convocadosOficial
            ) {

                alert(
                    "En un partido oficial deben ser exactamente " +
                    configuracion.convocadosOficial +
                    " convocados."
                );

                return;

            }


            if (
                tipoPartido.value === "amistoso" &&
                seleccionados.length > limite
            ) {

                alert(
                    "No puedes superar el total de jugadores del equipo."
                );

                return;

            }


            // =========================
            // ORDEN LOCAL / VISITANTE
            // =========================

            const lasRozas = {

                nombre: "Las Rozas",

                escudo: "escudos/Las_Rozas.png"

            };


            const rival = {

                nombre: rivalActual.nombre,

                escudo: rivalActual.escudo

            };


            let izquierda;
            let derecha;


            if (localVisitante.value === "local") {

                izquierda = lasRozas;
                derecha = rival;

            } else {

                izquierda = rival;
                derecha = lasRozas;

            }


            mostrarEquipo(
                document.getElementById("equipoIzquierda"),
                izquierda
            );


            mostrarEquipo(
                document.getElementById("equipoDerecha"),
                derecha
            );


            // =========================
            // INFORMACIÓN DEL PARTIDO
            // =========================

            const infoJornada =
                document.getElementById("infoJornada");

            if (tipoPartido.value === "amistoso") {

                infoJornada.textContent = "Amistoso";

            } else {

                infoJornada.textContent =
                    "Jornada " + jornadaSelect.value;

            }


            const fecha = fechaInput.value;

            if (fecha) {

                const partes = fecha.split("-");

                const fechaFormateada =
                    partes[2] + "/" +
                    partes[1] + "/" +
                    partes[0];

                document.getElementById("infoFecha")
                    .textContent =
                    "Fecha: " + fechaFormateada;

            } else {

                document.getElementById("infoFecha")
                    .textContent = "";

            }


            const campo = document.getElementById("campo").value;
            const lugar = document.getElementById("lugar").value;


            let ubicacion = "";

            if (campo && lugar) {

                ubicacion = campo + " (" + lugar + ")";

            } else if (campo) {

                ubicacion = campo;

            } else if (lugar) {

                ubicacion = lugar;

            }


            document.getElementById("infoCampo")
                .textContent =
                ubicacion ? "Campo: " + ubicacion : "";


            // =========================
            // EQUIPACIÓN
            // =========================

            document.getElementById("infoEquipacion")
                .textContent =
                "Equipación: " +
                camisetaSelect.value +
                " / " +
                pantalonSelect.value +
                " / " +
                mediasSelect.value;


            // =========================
            // LISTA DE JUGADORES
            // =========================

            const listaFinal =
                document.getElementById("listaFinalJugadores");

            listaFinal.innerHTML = "";


            seleccionados.forEach(checkbox => {

                const jugador =
                    equipoActual.jugadores[
                        checkbox.value
                    ];


                const li = document.createElement("li");

                li.textContent =
                    jugador.dorsal +
                    " - " +
                    jugador.nombre;


                listaFinal.appendChild(li);

            });


            // =========================
            // ENTRENADOR
            // =========================

            document.getElementById("entrenadorFinal")
                .textContent =
                equipoActual.entrenador || "";


            // =========================
            // CUERPO TÉCNICO
            // =========================

            const cuerpoTecnicoFinal =
                document.getElementById("cuerpoTecnicoFinal");

            cuerpoTecnicoFinal.innerHTML = "";


            if (
                equipoActual.cuerpoTecnico &&
                equipoActual.cuerpoTecnico.length
            ) {

                equipoActual.cuerpoTecnico.forEach(persona => {

                    const li = document.createElement("li");

                    li.textContent = persona;

                    cuerpoTecnicoFinal.appendChild(li);

                });

            }


            // =========================
            // MOSTRAR RESULTADO
            // =========================

            document.getElementById("resultado")
                .style.display = "block";


            document.getElementById("resultado")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }


        // =========================
        // MOSTRAR EQUIPO
        // =========================

        function mostrarEquipo(contenedor, equipo) {

            contenedor.innerHTML = "";

            const imagen = document.createElement("img");

            imagen.src = equipo.escudo;

            imagen.alt = equipo.nombre;


            const nombre = document.createElement("div");

            nombre.className = "equipo-nombre";

            nombre.textContent = equipo.nombre;


            contenedor.appendChild(imagen);
            contenedor.appendChild(nombre);

        }

    </script>

</body>
</html>
