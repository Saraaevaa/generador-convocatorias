<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Convocatorias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:disabled {
            background: #eee;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        .enfrentamiento {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
        }

        .equipoPartido {
            width: 180px;
            text-align: center;
        }

        .escudoPartido {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .nombreEquipoPartido {
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .vs {
            font-size: 24px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .jugadores {
            margin-top: 30px;
        }

        .jugador {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .jugador input[type="checkbox"] {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .jugador-info {
            flex: 1;
        }

        .jugador-dorsal {
            font-weight: bold;
            margin-right: 10px;
        }

        .jugador-posiciones {
            color: #777;
            margin-left: 8px;
        }

        #contadorConvocados {
            margin-top: 15px;
            font-weight: bold;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Generador de Convocatorias</h1>

    <div class="campo">
        <label for="equipo">Equipo</label>
        <select id="equipo">
            <option value="">Selecciona un equipo</option>
        </select>
    </div>

    <div class="campo">
        <label for="tipoPartido">Tipo de partido</label>
        <select id="tipoPartido">
            <option value="oficial">Partido oficial</option>
            <option value="amistoso">Amistoso</option>
        </select>
    </div>

    <div class="campo">
        <label for="jornada">Jornada</label>
        <input type="number" id="jornada" min="1">
    </div>

    <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
    </div>

    <div class="campo">
        <label for="rival">Rival</label>
        <select id="rival">
            <option value="">Selecciona un rival</option>
        </select>
    </div>

    <div class="campo">
        <label>Escudo del rival</label>

        <div style="text-align:center;">
            <img
                id="escudoRival"
                src=""
                alt="Escudo rival"
                style="width:100px;height:100px;object-fit:contain;"
            >
        </div>
    </div>

    <div class="campo">
        <label for="campo">Campo</label>
        <input
            type="text"
            id="campo"
            placeholder="Ej.: Julián Ariza"
        >
    </div>

    <div class="campo">
        <label for="lugar">Lugar</label>
        <input
            type="text"
            id="lugar"
            placeholder="Ej.: Torrelodones"
        >
    </div>

    <div class="campo">
        <label for="localVisitante">Local / Visitante</label>

        <select id="localVisitante">
            <option value="local">Local</option>
            <option value="visitante">Visitante</option>
        </select>
    </div>


    <div class="enfrentamiento" id="enfrentamiento">

        <div class="equipoPartido" id="bloqueLasRozas">

            <img
                id="escudoLasRozas"
                class="escudoPartido"
                src="escudos/Las_Rozas.png"
                alt="Las Rozas"
            >

            <div
                id="nombreLasRozas"
                class="nombreEquipoPartido"
            >
                Las Rozas
            </div>

        </div>


        <div class="vs" id="bloqueVS">
            VS
        </div>


        <div class="equipoPartido" id="bloqueRival">

            <img
                id="escudoRivalPartido"
                class="escudoPartido"
                src=""
                alt="Rival"
            >

            <div
                id="nombreRivalPartido"
                class="nombreEquipoPartido"
            >
                Rival
            </div>

        </div>

    </div>


    <div class="jugadores">

        <h2>Jugadores</h2>

        <div id="listaJugadores">
            Selecciona un equipo.
        </div>

        <div id="contadorConvocados">
            Convocados seleccionados: 0
        </div>

    </div>


    <button id="generar">
        Generar convocatoria
    </button>


    <div id="resultado"></div>

</div>


<script src="datos.js"></script>

<script>

    const selectorEquipo =
        document.getElementById("equipo");

    const selectorTipo =
        document.getElementById("tipoPartido");

    const selectorJornada =
        document.getElementById("jornada");

    const selectorFecha =
        document.getElementById("fecha");

    const selectorRival =
        document.getElementById("rival");

    const selectorCampo =
        document.getElementById("campo");

    const selectorLugar =
        document.getElementById("lugar");

    const selectorLocalVisitante =
        document.getElementById("localVisitante");

    const listaJugadores =
        document.getElementById("listaJugadores");

    const contadorConvocados =
        document.getElementById("contadorConvocados");

    const escudoRival =
        document.getElementById("escudoRival");

    const escudoRivalPartido =
        document.getElementById("escudoRivalPartido");

    const nombreRivalPartido =
        document.getElementById("nombreRivalPartido");

    const bloqueLasRozas =
        document.getElementById("bloqueLasRozas");

    const bloqueRival =
        document.getElementById("bloqueRival");

    const bloqueVS =
        document.getElementById("bloqueVS");

    const enfrentamiento =
        document.getElementById("enfrentamiento");


    function obtenerEquipoSeleccionado() {

        const idEquipo = selectorEquipo.value;

        return equipos.find(
            equipo => equipo.id === idEquipo
        );
    }


    function obtenerRivalSeleccionado() {

        const idRival = selectorRival.value;

        return rivales.find(
            rival => rival.id === idRival
        );
    }


    function obtenerLimiteConvocados() {

        const equipo =
            obtenerEquipoSeleccionado();

        if (!equipo) {
            return 0;
        }

        if (selectorTipo.value === "amistoso") {
            return equipo.totalJugadores;
        }

        return configuracion.convocadosOficial;
    }


    function actualizarContador() {

        const seleccionados =
            document.querySelectorAll(
                '#listaJugadores input[type="checkbox"]:checked'
            ).length;

        const limite =
            obtenerLimiteConvocados();

        contadorConvocados.textContent =
            `Convocados seleccionados: ${seleccionados} / ${limite}`;

    }


    function cargarEquipos() {

        selectorEquipo.innerHTML =
            '<option value="">Selecciona un equipo</option>';

        equipos.forEach(equipo => {

            const opcion =
                document.createElement("option");

            opcion.value = equipo.id;

            opcion.textContent = equipo.nombre;

            selectorEquipo.appendChild(opcion);

        });
    }


    function cargarRivales() {

        const equipo =
            obtenerEquipoSeleccionado();

        selectorRival.innerHTML =
            '<option value="">Selecciona un rival</option>';

        escudoRival.src = "";
        escudoRivalPartido.src = "";
        nombreRivalPartido.textContent = "Rival";


        if (!equipo) {
            return;
        }


        const rivalesEquipo =
            rivales.filter(rival =>
                rival.equipos.includes(equipo.id)
            );


        rivalesEquipo.forEach(rival => {

            const opcion =
                document.createElement("option");

            opcion.value = rival.id;

            opcion.textContent = rival.nombre;

            selectorRival.appendChild(opcion);

        });

    }


    function cargarJugadores() {

        const equipo =
            obtenerEquipoSeleccionado();

        listaJugadores.innerHTML = "";


        if (!equipo) {

            listaJugadores.textContent =
                "Selecciona un equipo.";

            actualizarContador();

            return;
        }


        equipo.jugadores.forEach(jugador => {

            const div =
                document.createElement("div");

            div.className = "jugador";


            const checkbox =
                document.createElement("input");

            checkbox.type = "checkbox";

            checkbox.value =
                jugador.dorsal;

            checkbox.dataset.nombre =
                jugador.nombre;


            checkbox.addEventListener(
                "change",
                actualizarContador
            );


            const info =
                document.createElement("div");

            info.className =
                "jugador-info";


            const posiciones =
                jugador.posiciones
                    .filter(posicion => posicion)
                    .join(" / ");


            info.innerHTML = `
                <span class="jugador-dorsal">
                    ${jugador.dorsal}
                </span>

                ${jugador.nombre}

                <span class="jugador-posiciones">
                    (${posiciones})
                </span>
            `;


            div.appendChild(checkbox);

            div.appendChild(info);

            listaJugadores.appendChild(div);

        });


        actualizarContador();

    }


    function actualizarRival() {

        const rival =
            obtenerRivalSeleccionado();


        if (!rival) {

            escudoRival.src = "";

            escudoRivalPartido.src = "";

            nombreRivalPartido.textContent =
                "Rival";

            return;
        }


        escudoRival.src =
            rival.escudo;

        escudoRivalPartido.src =
            rival.escudo;

        nombreRivalPartido.textContent =
            rival.nombre;

    }


    function actualizarLocalVisitante() {

        if (selectorLocalVisitante.value === "local") {

            enfrentamiento.appendChild(
                bloqueLasRozas
            );

            enfrentamiento.appendChild(
                bloqueVS
            );

            enfrentamiento.appendChild(
                bloqueRival
            );

        } else {

            enfrentamiento.appendChild(
                bloqueRival
            );

            enfrentamiento.appendChild(
                bloqueVS
            );

            enfrentamiento.appendChild(
                bloqueLasRozas
            );

        }

    }


    function obtenerLugarCompleto() {

        const campo =
            selectorCampo.value.trim();

        const lugar =
            selectorLugar.value.trim();


        if (campo && lugar) {
            return `${campo} (${lugar})`;
        }

        if (campo) {
            return campo;
        }

        if (lugar) {
            return lugar;
        }

        return "";

    }


    selectorEquipo.addEventListener(
        "change",
        function() {

            cargarRivales();

            cargarJugadores();

        }
    );


    selectorRival.addEventListener(
        "change",
        actualizarRival
    );


    selectorLocalVisitante.addEventListener(
        "change",
        actualizarLocalVisitante
    );


    selectorTipo.addEventListener(
        "change",
        function() {

            if (selectorTipo.value === "amistoso") {

                selectorJornada.value = "";

                selectorJornada.disabled = true;

            } else {

                selectorJornada.disabled = false;

            }

            actualizarContador();

        }
    );


    document
        .getElementById("generar")
        .addEventListener(
            "click",
            function() {

                const equipo =
                    obtenerEquipoSeleccionado();

                const rival =
                    obtenerRivalSeleccionado();

                const tipo =
                    selectorTipo.value;

                const lugarCompleto =
                    obtenerLugarCompleto();


                if (!equipo) {

                    alert(
                        "Selecciona un equipo."
                    );

                    return;
                }


                if (!rival) {

                    alert(
                        "Selecciona un rival."
                    );

                    return;
                }


                const seleccionados =
                    document.querySelectorAll(
                        '#listaJugadores input[type="checkbox"]:checked'
                    );


                const limite =
                    obtenerLimiteConvocados();


                if (seleccionados.length > limite) {

                    alert(
                        `No puedes seleccionar más de ${limite} jugadores.`
                    );

                    return;
                }


                const resultado =
                    document.getElementById("resultado");


                resultado.style.display =
                    "block";


                resultado.innerHTML = `

                    <strong>Convocatoria generada</strong><br><br>

                    Equipo: ${equipo.nombre}<br>

                    Rival: ${rival.nombre}<br>

                    Tipo: ${
                        tipo === "amistoso"
                            ? "Amistoso"
                            : "Partido oficial"
                    }<br>

                    Fecha: ${
                        selectorFecha.value || "Sin fecha"
                    }<br>

                    ${
                        tipo === "amistoso"
                            ? ""
                            : `Jornada: ${selectorJornada.value || "Sin jornada"}<br>`
                    }

                    Campo: ${
                        lugarCompleto || "Sin campo/lugar"
                    }<br>

                    Local / Visitante:
                    ${
                        selectorLocalVisitante.value === "local"
                            ? "Local"
                            : "Visitante"
                    }<br>

                    Jugadores seleccionados:
                    ${seleccionados.length}<br>

                    Límite de convocados:
                    ${limite}

                `;

            }
        );


    cargarEquipos();

    cargarRivales();

    cargarJugadores();

    actualizarLocalVisitante();

</script>

</body>
</html>
