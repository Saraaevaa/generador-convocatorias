<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Convocatorias</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #eeeeee;
            color: #111111;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .bloque {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background: white;
        }

        input[type="checkbox"] {
            width: auto;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #generar {
            width: 100%;
            background: #111111;
            color: white;
            font-size: 16px;
        }

        .jugador {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #eeeeee;
        }

        .jugador input {
            width: auto;
        }

        .contador {
            margin-top: 15px;
            font-weight: bold;
        }

        .equipacion-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .equipacion-item {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
        }


        /* =========================================
           CONVOCATORIA
           ========================================= */

        #resultado {
            display: none;
            padding: 0;
            background: transparent;
        }

        .convocatoria {

            width: 100%;
            max-width: 700px;
            margin: 0 auto;

            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);

        }


        /* CABECERA */

        .convocatoria-cabecera {

            background: #111111;
            color: white;

            text-align: center;

            padding: 25px 20px 20px;

        }

        .convocatoria-titulo {

            font-size: 32px;
            font-weight: 900;

            letter-spacing: 2px;

            margin-bottom: 12px;

        }

        .convocatoria-subtitulo {

            font-size: 16px;
            font-weight: bold;

        }


        /* PARTIDO */

        .partido {

            padding: 30px 25px 20px;

        }

        .equipos-partido {

            display: grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items: center;

            text-align: center;

            gap: 20px;

        }

        .equipo-partido {

            min-width: 0;

        }

        .equipo-partido img {

            width: 120px;
            height: 120px;

            object-fit: contain;

            display: block;

            margin: 0 auto 12px;

        }

        .equipo-nombre {

            font-size: 22px;
            font-weight: 900;

        }

        .vs {

            font-size: 20px;
            font-weight: 900;

        }


        /* INFORMACIÓN */

        .datos-partido {

            margin-top: 30px;

            border-top: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;

            padding: 18px 10px;

            text-align: center;

            line-height: 1.8;

        }

        #infoJornada {

            font-size: 20px;
            font-weight: 900;

        }

        #infoFecha {

            font-size: 17px;

        }

        #infoCampo {

            font-size: 16px;

        }


        /* EQUIPACIÓN */

        .equipacion-final {

            margin-top: 25px;

            padding: 18px;

            background: #f4f4f4;

            border-radius: 8px;

            text-align: center;

        }

        .equipacion-final-titulo {

            font-size: 17px;

            font-weight: 900;

            margin-bottom: 8px;

        }


        /* JUGADORES */

        .convocados {

            margin-top: 30px;

        }

        .seccion-titulo {

            text-align: center;

            font-size: 21px;

            font-weight: 900;

            margin-bottom: 15px;

            text-transform: uppercase;

        }

        .lista-final {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 0;

            border-top: 1px solid #dddddd;

        }

        .jugador-final {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 9px 8px;

            border-bottom: 1px solid #eeeeee;

            font-size: 15px;

        }

        .dorsal-final {

            width: 30px;

            height: 30px;

            border-radius: 50%;

            background: #111111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            flex-shrink: 0;

        }


        /* CUERPO TÉCNICO */

        .tecnico-final {

            margin-top: 30px;

            padding-top: 20px;

            border-top: 1px solid #dddddd;

            text-align: center;

        }

        .entrenador {

            font-weight: bold;

            margin-bottom: 10px;

        }

        .cuerpo-tecnico-lista {

            list-style: none;

            padding: 0;

            margin: 0;

        }

        .cuerpo-tecnico-lista li {

            margin-bottom: 4px;

        }


        /* PIE */

        .convocatoria-pie {

            margin-top: 30px;

            padding: 15px;

            background: #111111;

            color: white;

            text-align: center;

            font-size: 13px;

            font-weight: bold;

        }


        @media (max-width: 700px) {

            .equipacion-grid {
                grid-template-columns: 1fr;
            }

            .equipos-partido {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .vs {
                order: 2;
            }

            .lista-final {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

    <h1>Generador de Convocatorias</h1>


    <!-- =========================================
         FORMULARIO
         ========================================= -->

    <div class="bloque">

        <label for="equipo">
            Equipo
        </label>

        <select id="equipo">

            <option value="">
                Selecciona un equipo
            </option>

        </select>


        <label for="tipoPartido">
            Tipo de partido
        </label>

        <select id="tipoPartido">

            <option value="oficial">
                Partido oficial
            </option>

            <option value="amistoso">
                Amistoso
            </option>

        </select>


        <label for="jornada">
            Jornada
        </label>

        <input
            type="number"
            id="jornada"
            min="1"
            placeholder="Introduce la jornada"
        >


        <label for="fecha">
            Fecha
        </label>

        <input
            type="date"
            id="fecha"
        >


        <label for="rival">
            Rival
        </label>

        <select id="rival">

            <option value="">
                Selecciona un rival
            </option>

        </select>


        <label for="campo">
            Campo
        </label>

        <input
            type="text"
            id="campo"
            placeholder="Ej.: Campo de fútbol"
        >


        <label for="lugar">
            Lugar
        </label>

        <input
            type="text"
            id="lugar"
            placeholder="Ej.: Torrelodones"
        >


        <label for="localVisitante">
            Situación
        </label>

        <select id="localVisitante">

            <option value="local">
                Local
            </option>

            <option value="visitante">
                Visitante
            </option>

        </select>

    </div>


    <!-- =========================================
         JUGADORES
         ========================================= -->

    <div class="bloque">

        <h2>
            Jugadores convocados
        </h2>

        <div id="listaJugadores"></div>

        <div class="contador">

            Convocados:
            <span id="contador">
                0
            </span>

        </div>

    </div>


    <!-- =========================================
         EQUIPACIÓN
         ========================================= -->

    <div class="bloque">

        <h2>
            Equipación
        </h2>

        <div class="equipacion-grid">

            <div class="equipacion-item">

                <label for="camiseta">
                    Camiseta
                </label>

                <select id="camiseta"></select>

            </div>


            <div class="equipacion-item">

                <label for="pantalon">
                    Pantalón
                </label>

                <select id="pantalon"></select>

            </div>


            <div class="equipacion-item">

                <label for="medias">
                    Medias
                </label>

                <select id="medias"></select>

            </div>

        </div>

    </div>


    <div class="bloque">

        <button id="generar">
            Generar convocatoria
        </button>

    </div>


    <!-- =========================================
         RESULTADO
         ========================================= -->

    <div id="resultado">

        <div class="convocatoria">


            <!-- CABECERA -->

            <div class="convocatoria-cabecera">

                <div class="convocatoria-titulo">
                    CONVOCATORIA
                </div>

                <div
                    id="infoJornada"
                    class="convocatoria-subtitulo">
                </div>

            </div>


            <!-- PARTIDO -->

            <div class="partido">

                <div class="equipos-partido">

                    <div
                        id="equipoIzquierda"
                        class="equipo-partido">
                    </div>


                    <div class="vs">
                        VS
                    </div>


                    <div
                        id="equipoDerecha"
                        class="equipo-partido">
                    </div>

                </div>


                <!-- DATOS -->

                <div class="datos-partido">

                    <div id="infoFecha"></div>

                    <div id="infoCampo"></div>

                </div>


                <!-- EQUIPACIÓN -->

                <div class="equipacion-final">

                    <div class="equipacion-final-titulo">
                        EQUIPACIÓN
                    </div>

                    <div id="infoEquipacion"></div>

                </div>


                <!-- CONVOCADOS -->

                <div class="convocados">

                    <div class="seccion-titulo">
                        Convocados
                    </div>

                    <div
                        id="listaFinalJugadores"
                        class="lista-final">
                    </div>

                </div>


                <!-- CUERPO TÉCNICO -->

                <div class="tecnico-final">

                    <div class="seccion-titulo">
                        Cuerpo técnico
                    </div>

                    <div
                        id="entrenadorFinal"
                        class="entrenador">
                    </div>

                    <ul
                        id="cuerpoTecnicoFinal"
                        class="cuerpo-tecnico-lista">
                    </ul>

                </div>

            </div>


            <div class="convocatoria-pie">
                LAS ROZAS
            </div>

        </div>

    </div>


    <script src="datos.js"></script>


    <script>

        const equipoSelect =
            document.getElementById("equipo");

        const tipoPartido =
            document.getElementById("tipoPartido");

        const jornadaInput =
            document.getElementById("jornada");

        const rivalSelect =
            document.getElementById("rival");

        const fechaInput =
            document.getElementById("fecha");

        const localVisitante =
            document.getElementById("localVisitante");

        const listaJugadores =
            document.getElementById("listaJugadores");

        const contador =
            document.getElementById("contador");

        const camisetaSelect =
            document.getElementById("camiseta");

        const pantalonSelect =
            document.getElementById("pantalon");

        const mediasSelect =
            document.getElementById("medias");


        let equipoActual = null;


        // =========================================
        // EQUIPOS
        // =========================================

        equipos.forEach(equipo => {

            const option =
                document.createElement("option");

            option.value =
                equipo.id;

            option.textContent =
                equipo.nombre;

            equipoSelect.appendChild(option);

        });


        // =========================================
        // CAMBIO DE EQUIPO
        // =========================================

        equipoSelect.addEventListener(
            "change",
            () => {

                equipoActual =
                    equipos.find(
                        equipo =>
                            equipo.id ===
                            equipoSelect.value
                    );

                cargarRivales();

                cargarJugadores();

                cargarEquipacion();

            }
        );


        // =========================================
        // TIPO DE PARTIDO
        // =========================================

        tipoPartido.addEventListener(
            "change",
            () => {

                if (
                    tipoPartido.value ===
                    "amistoso"
                ) {

                    jornadaInput.disabled = true;

                    jornadaInput.value = "";

                } else {

                    jornadaInput.disabled = false;

                }

            }
        );


        // =========================================
        // RIVALES
        // =========================================

        function cargarRivales() {

            rivalSelect.innerHTML =
                '<option value="">Selecciona un rival</option>';


            if (!equipoActual) return;


            const rivalesEquipo =
                rivales.filter(
                    rival =>
                        rival.equipos.includes(
                            equipoActual.id
                        )
                );


            rivalesEquipo.forEach(rival => {

                const option =
                    document.createElement("option");

                option.value =
                    rival.id;

                option.textContent =
                    rival.nombre;

                rivalSelect.appendChild(option);

            });

        }


        // =========================================
        // JUGADORES
        // =========================================

        function cargarJugadores() {

            listaJugadores.innerHTML = "";

            contador.textContent = "0";


            if (!equipoActual) return;


            equipoActual.jugadores.forEach(
                (jugador, indice) => {

                    const div =
                        document.createElement("div");

                    div.className =
                        "jugador";


                    const checkbox =
                        document.createElement("input");

                    checkbox.type =
                        "checkbox";

                    checkbox.value =
                        indice;


                    checkbox.addEventListener(
                        "change",
                        actualizarContador
                    );


                    const texto =
                        document.createElement("span");


                    const posiciones =
                        jugador.posiciones
                            .filter(pos => pos)
                            .join(" / ");


                    texto.textContent =
                        jugador.dorsal +
                        " - " +
                        jugador.nombre +
                        (
                            posiciones
                                ? " (" +
                                  posiciones +
                                  ")"
                                : ""
                        );


                    div.appendChild(checkbox);

                    div.appendChild(texto);

                    listaJugadores.appendChild(div);

                }
            );

        }


        // =========================================
        // CONTADOR
        // =========================================

        function actualizarContador() {

            const seleccionados =
                listaJugadores.querySelectorAll(
                    'input[type="checkbox"]:checked'
                );


            contador.textContent =
                seleccionados.length;

        }


        // =========================================
        // EQUIPACIÓN
        // =========================================

        function cargarEquipacion() {

            camisetaSelect.innerHTML = "";

            pantalonSelect.innerHTML = "";

            mediasSelect.innerHTML = "";


            if (!equipoActual) return;


            const datosEquipacion =
                equipaciones.find(
                    equipacion =>
                        equipacion.equipoId ===
                        equipoActual.id
                );


            if (!datosEquipacion) return;


            datosEquipacion.camiseta.forEach(
                item => {

                    const option =
                        document.createElement("option");

                    option.value =
                        item.nombre;

                    option.textContent =
                        item.nombre +
                        " - " +
                        item.color;

                    camisetaSelect.appendChild(
                        option
                    );

                }
            );


            datosEquipacion.pantalon.forEach(
                item => {

                    const option =
                        document.createElement("option");

                    option.value =
                        item.nombre;

                    option.textContent =
                        item.nombre +
                        " - " +
                        item.color;

                    pantalonSelect.appendChild(
                        option
                    );

                }
            );


            datosEquipacion.medias.forEach(
                item => {

                    const option =
                        document.createElement("option");

                    option.value =
                        item.nombre;

                    option.textContent =
                        item.nombre +
                        " - " +
                        item.color;

                    mediasSelect.appendChild(
                        option
                    );

                }
            );

        }


        // =========================================
        // GENERAR
        // =========================================

        document
            .getElementById("generar")
            .addEventListener(
                "click",
                generarConvocatoria
            );


        function generarConvocatoria() {

            if (!equipoActual) {

                alert(
                    "Selecciona un equipo."
                );

                return;

            }


            const rivalId =
                rivalSelect.value;


            if (!rivalId) {

                alert(
                    "Selecciona un rival."
                );

                return;

            }


            if (
                tipoPartido.value ===
                "oficial" &&
                !jornadaInput.value
            ) {

                alert(
                    "Introduce la jornada."
                );

                return;

            }


            const rivalActual =
                rivales.find(
                    rival =>
                        rival.id === rivalId
                );


            const seleccionados =
                Array.from(
                    listaJugadores.querySelectorAll(
                        'input[type="checkbox"]:checked'
                    )
                );


            if (
                seleccionados.length === 0
            ) {

                alert(
                    "Selecciona los jugadores convocados."
                );

                return;

            }


            if (
                tipoPartido.value ===
                "oficial" &&
                seleccionados.length !==
                configuracion.convocadosOficial
            ) {

                alert(
                    "En un partido oficial deben ser exactamente " +
                    configuracion.convocadosOficial +
                    " convocados."
                );

                return;

            }


            // =========================================
            // EQUIPOS
            // =========================================

            const lasRozas = {

                nombre:
                    "Las Rozas",

                escudo:
                    "escudos/Las_Rozas.png"

            };


            const rival = {

                nombre:
                    rivalActual.nombre,

                escudo:
                    rivalActual.escudo

            };


            let izquierda;

            let derecha;


            if (
                localVisitante.value ===
                "local"
            ) {

                izquierda =
                    lasRozas;

                derecha =
                    rival;

            } else {

                izquierda =
                    rival;

                derecha =
                    lasRozas;

            }


            mostrarEquipo(
                document.getElementById(
                    "equipoIzquierda"
                ),
                izquierda
            );


            mostrarEquipo(
                document.getElementById(
                    "equipoDerecha"
                ),
                derecha
            );


            // =========================================
            // JORNADA
            // =========================================

            if (
                tipoPartido.value ===
                "amistoso"
            ) {

                document.getElementById(
                    "infoJornada"
                ).textContent =
                    "AMISTOSO";

            } else {

                document.getElementById(
                    "infoJornada"
                ).textContent =
                    "JORNADA " +
                    jornadaInput.value;

            }


            // =========================================
            // FECHA
            // =========================================

            const fecha =
                fechaInput.value;


            if (fecha) {

                const partes =
                    fecha.split("-");


                const fechaFormateada =
                    partes[2] +
                    "/" +
                    partes[1] +
                    "/" +
                    partes[0];


                document.getElementById(
                    "infoFecha"
                ).textContent =
                    "Fecha: " +
                    fechaFormateada;

            } else {

                document.getElementById(
                    "infoFecha"
                ).textContent =
                    "";

            }


            // =========================================
            // CAMPO / LUGAR
            // =========================================

            const campo =
                document.getElementById(
                    "campo"
                ).value;


            const lugar =
                document.getElementById(
                    "lugar"
                ).value;


            let ubicacion = "";


            if (campo && lugar) {

                ubicacion =
                    campo +
                    " (" +
                    lugar +
                    ")";

            } else if (campo) {

                ubicacion =
                    campo;

            } else if (lugar) {

                ubicacion =
                    lugar;

            }


            document.getElementById(
                "infoCampo"
            ).textContent =
                ubicacion
                    ? "Campo: " +
                      ubicacion
                    : "";


            // =========================================
            // EQUIPACIÓN
            // =========================================

            document.getElementById(
                "infoEquipacion"
            ).textContent =
                camisetaSelect.value +
                " / " +
                pantalonSelect.value +
                " / " +
                mediasSelect.value;


            // =========================================
            // JUGADORES
            // =========================================

            const listaFinal =
                document.getElementById(
                    "listaFinalJugadores"
                );


            listaFinal.innerHTML = "";


            seleccionados.forEach(
                checkbox => {

                    const jugador =
                        equipoActual.jugadores[
                            checkbox.value
                        ];


                    const jugadorDiv =
                        document.createElement(
                            "div"
                        );


                    jugadorDiv.className =
                        "jugador-final";


                    const dorsal =
                        document.createElement(
                            "div"
                        );


                    dorsal.className =
                        "dorsal-final";


                    dorsal.textContent =
                        jugador.dorsal;


                    const nombre =
                        document.createElement(
                            "div"
                        );


                    nombre.textContent =
                        jugador.nombre;


                    jugadorDiv.appendChild(
                        dorsal
                    );


                    jugadorDiv.appendChild(
                        nombre
                    );


                    listaFinal.appendChild(
                        jugadorDiv
                    );

                }
            );


            // =========================================
            // ENTRENADOR
            // =========================================

            document.getElementById(
                "entrenadorFinal"
            ).textContent =
                equipoActual.entrenador ||
                "";


            // =========================================
            // CUERPO TÉCNICO
            // =========================================

            const cuerpoTecnicoFinal =
                document.getElementById(
                    "cuerpoTecnicoFinal"
                );


            cuerpoTecnicoFinal.innerHTML =
                "";


            if (
                equipoActual.cuerpoTecnico &&
                equipoActual.cuerpoTecnico.length
            ) {

                equipoActual.cuerpoTecnico.forEach(
                    persona => {

                        const li =
                            document.createElement(
                                "li"
                            );

                        li.textContent =
                            persona;

                        cuerpoTecnicoFinal
                            .appendChild(li);

                    }
                );

            }


            // =========================================
            // MOSTRAR
            // =========================================

            document.getElementById(
                "resultado"
            ).style.display =
                "block";


            document.getElementById(
                "resultado"
            ).scrollIntoView({
                behavior: "smooth"
            });

        }


        // =========================================
        // MOSTRAR EQUIPO
        // =========================================

        function mostrarEquipo(
            contenedor,
            equipo
        ) {

            contenedor.innerHTML =
                "";


            const imagen =
                document.createElement(
                    "img"
                );


            imagen.src =
                equipo.escudo;


            imagen.alt =
                equipo.nombre;


            const nombre =
                document.createElement(
                    "div"
                );


            nombre.className =
                "equipo-nombre";


            nombre.textContent =
                equipo.nombre;


            contenedor.appendChild(
                imagen
            );


            contenedor.appendChild(
                nombre
            );

        }

    </script>

</body>
</html>
