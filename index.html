<title>Generador de Convocatorias</title>

<!-- =========================================================
     TIPOGRAFÍAS
     Montserrat = tipografía principal
     Anton = sustituta visual de Extenga 50 Mega
     Archivo Black = sustituta visual de TT Interphases
========================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">


<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
    }

    body {
        background: #eeeeee;
        font-family: "Montserrat", Arial, sans-serif;
        color: #111;
        padding: 25px;
    }


    /* =========================================================
       CONTENEDOR GENERAL
    ========================================================= */

    .pagina {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;

        display: grid;
        grid-template-columns: minmax(420px, 520px) minmax(0, 1fr);
        gap: 35px;

        align-items: start;
    }


    /* =========================================================
       FORMULARIO
    ========================================================= */

    .formulario {
        width: 100%;
        background: white;
        padding: 30px;
        border-radius: 12px;

        box-shadow:
            0 5px 25px rgba(0,0,0,0.08);
    }

    .formulario h1 {
        margin-top: 0;
        margin-bottom: 28px;
        font-size: 30px;
    }

    .formulario h3 {
        margin-top: 30px;
        margin-bottom: 15px;
    }

    .campo-form {
        margin-bottom: 18px;
    }

    .campo-form label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .campo-form input,
    .campo-form select {
        width: 100%;
        padding: 11px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
    }

    .fila {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .jugadores-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 20px;
    }

    .titulo-jugadores {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .contador-convocados {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-width: 62px;
        padding: 5px 10px;

        border-radius: 20px;
        background: #01408e;
        color: white;

        font-size: 16px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: .5px;
    }

    .aviso-convocados {
        min-height: 20px;
        margin-top: -8px;
        margin-bottom: 10px;

        color: #c51d65;
        font-size: 13px;
        font-weight: 700;
    }

    .jugador-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .jugador-checkbox input {
        flex-shrink: 0;
    }

    .equipaciones-form {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 7px;
        background: #01408e;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #012f69;
    }


    /* =========================================================
       PREVISUALIZACIÓN
    ========================================================= */

    .previsualizacion {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: sticky;
        top: 25px;
    }

    .convocatoria-wrapper {
        position: relative;
        width: 100%;
        max-width: 560px;
        aspect-ratio: 9 / 16;
        overflow: hidden;

        box-shadow:
            0 10px 40px rgba(0,0,0,0.18);

        background: white;
    }


    /* =========================================================
       CONVOCATORIA REAL
       SIEMPRE 1080 x 1920
    ========================================================= */

    .convocatoria {
        position: absolute;
        left: 0;
        top: 0;

        width: 1080px;
        height: 1920px;

        background: white;
        overflow: hidden;

        display: flex;
        flex-direction: column;

        transform-origin: top left;
    }


    /* =========================================================
       CABECERA AZUL
       NO MODIFICAR: AJUSTADA PREVIAMENTE
    ========================================================= */

    .cabecera-azul {
        height: 750px;
        min-height: 750px;

        background: #01408e;
        color: white;

        text-align: center;
        position: relative;

        padding: 42px 55px 0;

        z-index: 2;
    }


    /* =========================================================
       JORNADA / AMISTOSO
       CANVA: MONTSERRAT 27,7 BOLD
    ========================================================= */

    .jornada-capsula {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-width: 430px;
        height: 70px;

        padding: 0 48px;

        background: white;
        color: #111;

        border-radius: 38px;

        font-family: "Montserrat", Arial, sans-serif;
        font-size: 27.7px;
        font-weight: 700;

        letter-spacing: 2px;

        margin-bottom: 18px;
    }


    /* =========================================================
       FECHA
       CANVA: MONTSERRAT 24 BOLD
    ========================================================= */

    .fecha {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 1.5px;

        margin-bottom: 13px;
    }


    /* =========================================================
       CAMPO / LUGAR
       CANVA: MONTSERRAT 24 REGULAR
    ========================================================= */

    .campo {
        display: flex;
        align-items: center;
        justify-content: center;

        font-family: "Montserrat", Arial, sans-serif;

        font-size: 24px;
        font-weight: 400;

        letter-spacing: 1.5px;

        margin-bottom: 37px;

        text-transform: uppercase;

        white-space: nowrap;
    }

    .icono-ubicacion {
        display: inline-block;
        width: 18px;
        height: 23px;
        margin-right: 9px;
        position: relative;
        flex: 0 0 18px;
        vertical-align: middle;
    }

    /* Chincheta tipo Google Maps: gota invertida */
    .icono-ubicacion::before {
        content: '';

        position: absolute;

        width: 15px;
        height: 15px;

        left: 1px;
        top: 1px;

        background: white;

        border-radius: 50% 50% 50% 0;

        transform: rotate(-45deg);
    }

    .icono-ubicacion::after {
        content: '';

        position: absolute;

        width: 5px;
        height: 5px;

        left: 6px;
        top: 6px;

        background: #01408e;

        border-radius: 50%;

        z-index: 2;
    }


    /* =========================================================
       CONVOCATORIA
       CANVA: EXTENGA 50 MEGA 157
       SUSTITUTA: ANTON
    ========================================================= */

    .titulo-convocatoria {
        font-family: "Anton", Impact, sans-serif;

        font-size: 157px;
        font-weight: 400;

        line-height: 0.84;

        letter-spacing: 0;

        margin-bottom: 13px;

        white-space: nowrap;

        transform: scaleX(.91);
    }


    /* =========================================================
       CATEGORÍA
       CANVA: MONTSERRAT 24
    ========================================================= */

    .categoria {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 27px;
        font-weight: 700;

        letter-spacing: 1.5px;

        text-transform: uppercase;

        margin-bottom: 34px;
    }


    /* =========================================================
       ENFRENTAMIENTO
       AJUSTE: UN POCO MÁS CORTO
    ========================================================= */

    .enfrentamiento {
        width: 620px;
        height: 176px;

        margin: 0 auto;

        background: white;

        border-radius: 90px;

        color: #111;

        padding: 10px 24px;

        position: relative;
    }

    .equipos {
        height: 100%;

        display: grid;

        grid-template-columns: 1fr 55px 1fr;

        align-items: center;

        gap: 0;
    }

    .equipo {
        height: 100%;

        display: flex;

        align-items: center;

        justify-content: center;
    }

    .equipo img {
        width: 132px;
        height: 132px;

        object-fit: contain;
    }


    /* =========================================================
       VS
       CANVA: MONTSERRAT 24 BOLD
    ========================================================= */

    .vs {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 34px;
        font-weight: 700;

        letter-spacing: 0;
    }


    /* =========================================================
       NOMBRES EQUIPOS
       CANVA: MONTSERRAT 24
    ========================================================= */

    .nombres-equipos {
        width: 820px;
        max-width: 100%;

        margin: 15px auto 0;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 55px;
    }

    .nombre-equipo {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 27px;
        font-weight: 700;

        letter-spacing: 1.2px;

        text-transform: uppercase;

        white-space: nowrap;
    }

    .nombre-equipo.izquierda {
        text-align: left;
    }

    .nombre-equipo.derecha {
        text-align: right;
    }


    /* =========================================================
       DIAGONAL AZUL / BLANCO
       NO MODIFICAR
    ========================================================= */

    .cabecera-azul::after {
        content: "";

        position: absolute;

        left: -2%;
        right: -2%;

        bottom: -27px;

        height: 55px;

        background: white;

        transform: rotate(-1.7deg);

        transform-origin: center;
    }


    /* =========================================================
       ZONA BLANCA
    ========================================================= */

    .zona-blanca {
        flex: 1;

        background: white;

        position: relative;

        z-index: 1;

        padding: 55px 78px 22px;

        display: flex;
        flex-direction: column;

        min-height: 0;
    }

    .lista-jugadores {
        display: grid;

        grid-template-columns: 1fr 1fr;

        column-gap: 70px;

        flex: 1;

        min-height: 0;
    }

    .columna-jugadores {
        display: flex;
        flex-direction: column;
    }

    .grupo-posicion {
        margin-bottom: 21px;
    }


    /* =========================================================
       POSICIONES
       CANVA: MONTSERRAT 22,8 BOLD
    ========================================================= */

    .titulo-posicion {
        color: #064691;

        font-family: "Montserrat", Arial, sans-serif;

        font-size: 22.8px;
        font-weight: 700;

        letter-spacing: 1px;

        margin-bottom: 7px;

        text-transform: uppercase;
    }

    .jugador {
        display: grid;

        grid-template-columns: 58px 1fr;

        align-items: center;

        min-height: 54px;
    }


    /* =========================================================
       DORSALES
       CANVA: TT INTERPHASES 29,4 BOLD
       SUSTITUTA: ARCHIVO BLACK
    ========================================================= */

    .dorsal {
        color: #f12691;

        font-family: "Archivo Black", Arial, sans-serif;

        font-size: 29.4px;
        font-weight: 400;

        text-align: center;

        line-height: 1;
    }


    /* =========================================================
       NOMBRES JUGADORES
       CANVA: MONTSERRAT 29,6 BOLD
    ========================================================= */

    .nombre-jugador {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 29.6px;
        font-weight: 700;

        text-transform: uppercase;

        line-height: 1.02;

        white-space: nowrap;

        letter-spacing: 0;
    }


    /* =========================================================
       STAFF
    ========================================================= */

    .staff {
        text-align: center;

        margin-top: auto;

        padding-top: 6px;

        padding-bottom: 2px;
    }


    /* =========================================================
       ENTRENADOR / CUERPO TÉCNICO
       CONFIGURACIÓN BASE
    ========================================================= */

    .staff-titulo,
    .entrenador-label {
        color: #064691;

        font-family: "Montserrat", Arial, sans-serif;

        font-size: 18.2px;
        font-weight: 700;

        letter-spacing: 1px;

        margin-bottom: 6px;

        text-transform: uppercase;
    }


    /* =========================================================
       NOMBRES STAFF
    ========================================================= */

    .staff-nombre {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 22.3px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: .5px;

        margin-bottom: 9px;
    }


    /* =========================================================
       CONFIGURACIÓN 18 JUGADORES
       MÁS AIRE + STAFF LIGERAMENTE MAYOR Y MÁS ARRIBA
    ========================================================= */

    .convocatoria.config-18 .staff {
        transform: translateY(-12px);
    }

    .convocatoria.config-18 .staff-titulo,
    .convocatoria.config-18 .entrenador-label {
        font-size: 19px;
        margin-bottom: 6px;
    }

    .convocatoria.config-18 .staff-nombre {
        font-size: 23.5px;
        margin-bottom: 9px;
    }


    /* =========================================================
       CONFIGURACIÓN 24 JUGADORES
       MÁS COMPACTA PARA EVITAR SUPERPOSICIONES
    ========================================================= */

    .convocatoria.config-24 .zona-blanca {
        padding-top: 48px;
        padding-bottom: 20px;
    }

    .convocatoria.config-24 .grupo-posicion {
        margin-bottom: 12px;
    }

    .convocatoria.config-24 .titulo-posicion {
        font-size: 21.5px;
        margin-bottom: 4px;
    }

    .convocatoria.config-24 .jugador {
        min-height: 44px;
    }

    .convocatoria.config-24 .dorsal {
        font-size: 27px;
    }

    .convocatoria.config-24 .nombre-jugador {
        font-size: 27px;
        line-height: 1;
    }

    .convocatoria.config-24 .staff {
        padding-top: 3px;
        padding-bottom: 0;
    }

    .convocatoria.config-24 .staff-titulo,
    .convocatoria.config-24 .entrenador-label {
        font-size: 17px;
        margin-bottom: 4px;
    }

    .convocatoria.config-24 .staff-nombre {
        font-size: 20px;
        margin-bottom: 6px;
    }


    /* =========================================================
       DIAGONAL BLANCO / AZUL
       NO MODIFICAR
    ========================================================= */

    .zona-blanca::after {
        content: "";

        position: absolute;

        left: -2%;
        right: -2%;

        bottom: -25px;

        height: 50px;

        background: #064691;

        transform: rotate(-1.7deg);

        transform-origin: center;

        z-index: 5;
    }


    /* =========================================================
       PIE AZUL
    ========================================================= */

    .pie-azul {
        height: 275px;
        min-height: 275px;

        background: #01408e;

        color: white;

        display: grid;

        grid-template-columns: 1fr 1fr;

        position: relative;

        z-index: 4;

        padding: 26px 55px 18px;
    }


    /* =========================================================
       EQUIPACIÓN
       AHORA EN ESQUINA INFERIOR DERECHA
    ========================================================= */

    .equipacion-pie {
        position: static;

        display: block;
    }

    .kit-visual {
        position: absolute;

        left: auto;
        right: 45px;
        top: auto;
        bottom: 0;

        width: 112px;
        height: 248px;

        background: white;

        border-radius: 58px;

        overflow: hidden;
    }

    .pieza-kit {
        position: absolute;

        object-fit: contain;
    }

    .camiseta-kit {
        width: 103px;
        height: 103px;

        left: 4px;
        top: 5px;

        z-index: 3;
    }

    .pantalon-kit {
        width: 91px;
        height: 91px;

        left: 10px;
        top: 84px;

        z-index: 2;
    }

    .medias-kit {
        width: 94px;
        height: 94px;

        left: 9px;
        top: 154px;

        z-index: 1;
    }


    /* =========================================================
       HORARIOS
       LIGERAMENTE MÁS GRANDES
       Y COLOCADOS A LA IZQUIERDA DE LA EQUIPACIÓN
    ========================================================= */

    .horarios {
        position: absolute;

        right: 205px;
        top: 0;
        bottom: 0;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: flex-end;

        text-align: right;

        padding-right: 0;
    }

    .hora-bloque {
        margin-bottom: 15px;
    }

    .hora-titulo {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 28px;
        font-weight: 700;

        letter-spacing: 2px;

        margin-bottom: 5px;
    }

    .hora {
        font-family: "Montserrat", Arial, sans-serif;

        font-size: 28px;
        font-weight: 700;

        letter-spacing: 2px;
    }


    /* =========================================================
       PANTALLAS PEQUEÑAS
    ========================================================= */

    @media (max-width: 1050px) {

        body {
            padding: 15px;
        }

        .pagina {
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .formulario {
            max-width: 800px;
            margin: 0 auto;
        }

        .previsualizacion {
            position: relative;
            top: auto;
        }

        .convocatoria-wrapper {
            max-width: 600px;
        }
    }


    @media (max-width: 700px) {

        body {
            padding: 10px;
        }

        .formulario {
            padding: 20px;
        }

        .formulario h1 {
            font-size: 25px;
        }

        .fila {
            grid-template-columns: 1fr;
        }

        .jugadores-form {
            grid-template-columns: 1fr;
        }

        .equipaciones-form {
            grid-template-columns: 1fr;
        }

        .convocatoria-wrapper {
            width: 100%;
            max-width: 100%;
        }
    }

</style>


<!-- =========================================================
     PÁGINA GENERAL
========================================================= -->

<div class="pagina">


    <!-- =====================================================
         FORMULARIO
    ===================================================== -->

    <div class="formulario">

        <h1>
            Generador de convocatorias
        </h1>


        <div class="campo-form">

            <label for="equipo">
                Equipo
            </label>

            <select id="equipo"></select>

        </div>


        <div class="fila">

            <div class="campo-form">

                <label for="tipoPartido">
                    Tipo de partido
                </label>

                <select id="tipoPartido">

                    <option value="oficial">
                        Partido oficial
                    </option>

                    <option value="amistoso">
                        Amistoso
                    </option>

                </select>

            </div>


            <div class="campo-form">

                <label for="jornada">
                    Jornada
                </label>

                <input
                    type="number"
                    id="jornada"
                    min="1"
                    placeholder="Ej. 22">

            </div>

        </div>


        <div class="fila">

            <div class="campo-form">

                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha">

            </div>


            <div class="campo-form">

                <label for="horaPartido">
                    Hora del partido
                </label>

                <input
                    type="time"
                    id="horaPartido"
                    step="60">

            </div>

        </div>


        <div class="campo-form">

            <label for="horaConvocatoria">
                Hora de convocatoria
            </label>

            <input
                type="time"
                id="horaConvocatoria"
                step="60">

        </div>


        <div class="campo-form">

            <label for="rival">
                Rival
            </label>

            <select id="rival"></select>

        </div>


        <div class="campo-form">

            <label for="localVisitante">
                Las Rozas
            </label>

            <select id="localVisitante">

                <option value="local">
                    Local
                </option>

                <option value="visitante">
                    Visitante
                </option>

            </select>

        </div>


        <div class="fila">

            <div class="campo-form">

                <label for="campo">
                    Campo
                </label>

                <input
                    type="text"
                    id="campo"
                    placeholder="Ej. Julián Ariza">

            </div>


            <div class="campo-form">

                <label for="lugar">
                    Lugar
                </label>

                <input
                    type="text"
                    id="lugar"
                    placeholder="Ej. Torrelodones">

            </div>

        </div>


        <h3 class="titulo-jugadores">
            Jugadores convocados
            <span id="contadorConvocados" class="contador-convocados">0/18</span>
        </h3>

        <div id="avisoConvocados" class="aviso-convocados"></div>


        <div
            id="jugadoresForm"
            class="jugadores-form">
        </div>


        <h3>
            Equipación
        </h3>


        <div class="equipaciones-form">

            <div class="campo-form">

                <label for="camiseta">
                    Camiseta
                </label>

                <select id="camiseta"></select>

            </div>


            <div class="campo-form">

                <label for="pantalon">
                    Pantalón
                </label>

                <select id="pantalon"></select>

            </div>


            <div class="campo-form">

                <label for="medias">
                    Medias
                </label>

                <select id="medias"></select>

            </div>

        </div>


        <button onclick="generarConvocatoria()">
            Generar convocatoria
        </button>

    </div>



    <!-- =====================================================
         PREVISUALIZACIÓN
    ===================================================== -->

    <div class="previsualizacion">


        <div
            id="convocatoriaWrapper"
            class="convocatoria-wrapper">


            <div
                id="convocatoria"
                class="convocatoria">


                <!-- =========================================
                     CABECERA
                ========================================== -->

                <div class="cabecera-azul">


                    <div
                        id="jornadaVisual"
                        class="jornada-capsula">

                        JORNADA 22

                    </div>


                    <div
                        id="fechaVisual"
                        class="fecha">

                        SÁBADO 16 DE MAYO

                    </div>


                    <div
                        id="campoVisual"
                        class="campo">

                        <span class="icono-ubicacion"></span>

                        JULIÁN ARIZA (TORRELODONES)

                    </div>


                    <div class="titulo-convocatoria">

                        CONVOCATORIA

                    </div>


                    <div
                        id="categoriaVisual"
                        class="categoria">

                        CADETE B (AUTONÓMICA)

                    </div>


                    <div class="enfrentamiento">


                        <div class="equipos">


                            <div class="equipo">

                                <img
                                    id="escudoLocal"
                                    src="escudos/Las_Rozas.png"
                                    alt="Las Rozas">

                            </div>


                            <div class="vs">
                                VS
                            </div>


                            <div class="equipo">

                                <img
                                    id="escudoVisitante"
                                    src="escudos/Fundación_ADF.png"
                                    alt="Rival">

                            </div>

                        </div>

                    </div>


                    <div class="nombres-equipos">


                        <div
                            id="nombreLocal"
                            class="nombre-equipo izquierda">

                            LAS ROZAS

                        </div>


                        <div
                            id="nombreVisitante"
                            class="nombre-equipo derecha">

                            FUNDACIÓN ADF 'A'

                        </div>

                    </div>

                </div>



                <!-- =========================================
                     ZONA BLANCA
                ========================================== -->

                <div class="zona-blanca">


                    <div
                        id="listaJugadores"
                        class="lista-jugadores">


                        <div
                            id="columnaIzquierda"
                            class="columna-jugadores">
                        </div>


                        <div
                            id="columnaDerecha"
                            class="columna-jugadores">
                        </div>


                    </div>


                    <div class="staff">


                        <div class="entrenador-label">
                            ENTRENADOR
                        </div>


                        <div
                            id="entrenadorVisual"
                            class="staff-nombre">

                            EDUARDO CABALLERO

                        </div>


                        <div class="staff-titulo">
                            CUERPO TÉCNICO
                        </div>


                        <div
                            id="cuerpoTecnicoVisual"
                            class="staff-nombre">

                            DAVID | KIM | VALENZUELA

                        </div>


                    </div>

                </div>



                <!-- =========================================
                     PIE AZUL
                ========================================== -->

                <div class="pie-azul">


                    <div class="equipacion-pie">


                        <div class="kit-visual">


                            <img
                                id="camisetaVisual"
                                class="pieza-kit camiseta-kit"
                                src=""
                                alt="Camiseta">


                            <img
                                id="pantalonVisual"
                                class="pieza-kit pantalon-kit"
                                src=""
                                alt="Pantalón">


                            <img
                                id="mediasVisual"
                                class="pieza-kit medias-kit"
                                src=""
                                alt="Medias">


                        </div>

                    </div>


                    <div class="horarios">


                        <div class="hora-bloque">

                            <div class="hora-titulo">
                                PARTIDO
                            </div>


                            <div
                                id="horaPartidoVisual"
                                class="hora">

                                13:30

                            </div>

                        </div>


                        <div class="hora-bloque">

                            <div class="hora-titulo">
                                CONVOCATORIA
                            </div>


                            <div
                                id="horaConvocatoriaVisual"

                </div>


            </div>

        </div>

    </div>

</div>



<!-- =========================================================
     DATOS
========================================================= -->

<script src="datos.js"></script>


<script>

    /* =========================================================
       REFERENCIAS
    ========================================================= */

    const equipoSelect =
        document.getElementById("equipo");

    const tipoPartidoSelect =
        document.getElementById("tipoPartido");

    const jornadaInput =
        document.getElementById("jornada");

    const fechaInput =
        document.getElementById("fecha");

    const horaPartidoInput =
        document.getElementById("horaPartido");

    const horaConvocatoriaInput =
        document.getElementById("horaConvocatoria");

    const rivalSelect =
        document.getElementById("rival");

    const localVisitanteSelect =
        document.getElementById("localVisitante");

    const campoInput =
        document.getElementById("campo");

    const lugarInput =
        document.getElementById("lugar");

    const jugadoresForm =
        document.getElementById("jugadoresForm");

    const camisetaSelect =
        document.getElementById("camiseta");

    const pantalonSelect =
        document.getElementById("pantalon");

    const mediasSelect =
        document.getElementById("medias");


    /* =========================================================
       ESCALADO
    ========================================================= */

    function ajustarConvocatoria() {

        const wrapper =
            document.getElementById(
                "convocatoriaWrapper"
            );

        const canvas =
            document.getElementById(
                "convocatoria"
            );


        if (!wrapper || !canvas) {
            return;
        }


        let anchoDisponible =
            Math.min(
                560,
                window.innerWidth
            );


        const alturaDisponible =
            Math.max(
                300,
                window.innerHeight - 50
            );


        let escalaPorAncho =
            anchoDisponible / 1080;


        let escalaPorAltura =
            alturaDisponible / 1920;


        let escala =
            Math.min(
                escalaPorAncho,
                escalaPorAltura,
                1
            );


        const anchoVisual =
            1080 * escala;

        const altoVisual =
            1920 * escala;


        wrapper.style.width =
            `${anchoVisual}px`;

        wrapper.style.height =
            `${altoVisual}px`;


        canvas.style.transform =
            `scale(${escala})`;

    }


    window.addEventListener(
        "resize",
        ajustarConvocatoria
    );


    /* =========================================================
       CARGAR EQUIPOS
    ========================================================= */

    equipos.forEach(
        equipo => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                equipo.id;

            option.textContent =
                equipo.nombre;

            equipoSelect.appendChild(
                option
            );

        }
    );


    /* =========================================================
       CARGAR RIVALES
    ========================================================= */

    function cargarRivales() {

        rivalSelect.innerHTML = "";

        const equipoId =
            equipoSelect.value;


        rivales
            .filter(
                rival =>
                    rival.equipos.includes(
                        equipoId
                    )
            )
            .forEach(
                rival => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        rival.id;

                    option.textContent =
                        rival.nombre;

                    rivalSelect.appendChild(
                        option
                    );

                }
            );

    }


    /* =========================================================
       CARGAR JUGADORES
    ========================================================= */

    function actualizarContadorConvocados() {

        const checkboxes =
            jugadoresForm.querySelectorAll(
                "input[type='checkbox']"
            );

        const seleccionados =
            jugadoresForm.querySelectorAll(
                "input[type='checkbox']:checked"
            ).length;

        const limite =
            tipoPartidoSelect.value === "oficial"
                ? 18
                : 24;

        const contador =
            document.getElementById(
                "contadorConvocados"
            );

        const aviso =
            document.getElementById(
                "avisoConvocados"
            );

        if (contador) {
            contador.textContent =
                `${seleccionados}/${limite}`;
        }

        if (aviso) {

            if (
                tipoPartidoSelect.value === "oficial" &&
                seleccionados !== 18
            ) {
                aviso.textContent =
                    seleccionados < 18
                        ? `Faltan ${18 - seleccionados} jugador${18 - seleccionados === 1 ? "" : "es"} para completar los 18.`
                        : "En partido oficial deben ser exactamente 18 jugadores.";
            }
            else if (
                tipoPartidoSelect.value === "amistoso" &&
                seleccionados > 24
            ) {
                aviso.textContent =
                    "En un amistoso el máximo es de 24 jugadores.";
            }
            else {
                aviso.textContent = "";
            }
        }

        checkboxes.forEach(
            checkbox => {

                if (
                    !checkbox.checked &&
                    tipoPartidoSelect.value === "oficial" &&
                    seleccionados >= 18
                ) {
                    checkbox.disabled = true;
                }
                else if (
                    !checkbox.checked &&
                    tipoPartidoSelect.value === "amistoso" &&
                    seleccionados >= 24
                ) {
                    checkbox.disabled = true;
                }
                else {
                    checkbox.disabled = false;
                }

            }
        );

    }


    function cargarJugadores() {

        jugadoresForm.innerHTML = "";

        const equipo =
            equipos.find(
                e =>
                    e.id ===
                    equipoSelect.value
            );

        if (!equipo) {
            return;
        }

        equipo.jugadores.forEach(
            (
                jugador,
                index
            ) => {

                const label =
                    document.createElement(
                        "label"
                    );

                label.className =
                    "jugador-checkbox";

                const checkbox =
                    document.createElement(
                        "input"
                    );

                checkbox.type =
                    "checkbox";

                checkbox.value =
                    index;

                checkbox.dataset.dorsal =
                    jugador.dorsal;

                checkbox.addEventListener(
                    "change",
                    actualizarContadorConvocados
                );

                const texto =
                    document.createElement(
                        "span"
                    );

                texto.textContent =
                    `${jugador.dorsal} - ${jugador.nombre}`;

                label.appendChild(
                    checkbox
                );

                label.appendChild(
                    texto
                );

                jugadoresForm.appendChild(
                    label
                );

            }
        );

        actualizarContadorConvocados();

    }


    /* =========================================================
       CARGAR EQUIPACIONES
    ========================================================= */

    function cargarEquipacion() {

        const equipo =
            equipaciones.find(
                e =>
                    e.equipoId ===
                    equipoSelect.value
            );


        if (!equipo) {
            return;
        }


        camisetaSelect.innerHTML = "";

        pantalonSelect.innerHTML = "";

        mediasSelect.innerHTML = "";


        equipo.camiseta.forEach(
            (
                item,
                index
            ) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    index;

                option.textContent =
                    item.nombre;

                camisetaSelect.appendChild(
                    option
                );

            }
        );


        equipo.pantalon.forEach(
            (
                item,
                index
            ) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    index;

                option.textContent =
                    item.nombre;

                pantalonSelect.appendChild(
                    option
                );

            }
        );


        equipo.medias.forEach(
            (
                item,
                index
            ) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    index;

                option.textContent =
                    item.nombre;

                mediasSelect.appendChild(
                    option
                );

            }
        );

    }


    /* =========================================================
       CAMBIO DE EQUIPO
    ========================================================= */

    equipoSelect.addEventListener(
        "change",
        () => {

            cargarRivales();

            cargarJugadores();

            cargarEquipacion();

        }
    );

    tipoPartidoSelect.addEventListener(
        "change",
        () => {
            actualizarContadorConvocados();
        }
    );


    /* =========================================================
       FORMATO FECHA
    ========================================================= */

    function formatearFecha(
        fecha
    ) {

        if (!fecha) {
            return "";
        }


        const partes =
            fecha.split("-");


        const fechaObj =
            new Date(
                partes[0],
                partes[1] - 1,
                partes[2]
            );


        const dias = [
            "domingo",
            "lunes",
            "martes",
            "miércoles",
            "jueves",
            "viernes",
            "sábado"
        ];


        const meses = [
            "enero",
            "febrero",
            "marzo",
            "abril",
            "mayo",
            "junio",
            "julio",
            "agosto",
            "septiembre",
            "octubre",
            "noviembre",
            "diciembre"
        ];


        return `${dias[fechaObj.getDay()]} ${fechaObj.getDate()} de ${meses[fechaObj.getMonth()]}`;

    }


    /* =========================================================
       MAYÚSCULAS
    ========================================================= */

    function mayusculas(
        texto
    ) {

        return (
            texto || ""
        ).toLocaleUpperCase(
            "es-ES"
        );

    }


    /* =========================================================
       CREAR GRUPO DE POSICIÓN
    ========================================================= */

    function crearGrupo(
        titulo,
        jugadores
    ) {

        if (!jugadores.length) {
            return null;
        }


        const grupo =
            document.createElement(
                "div"
            );

        grupo.className =
            "grupo-posicion";


        const tituloElemento =
            document.createElement(
                "div"
            );

        tituloElemento.className =
            "titulo-posicion";

        tituloElemento.textContent =
            titulo;


        grupo.appendChild(
            tituloElemento
        );


        jugadores.forEach(
            jugador => {

                const elemento =
                    document.createElement(
                        "div"
                    );

                elemento.className =
                    "jugador";


                const dorsal =
                    document.createElement(
                        "div"
                    );

                dorsal.className =
                    "dorsal";

                dorsal.textContent =
                    jugador.dorsal;


                const nombre =
                    document.createElement(
                        "div"
                    );

                nombre.className =
                    "nombre-jugador";

                nombre.textContent =
                    mayusculas(
                        jugador.nombre
                    );


                elemento.appendChild(
                    dorsal
                );

                elemento.appendChild(
                    nombre
                );


                grupo.appendChild(
                    elemento
                );

            }
        );


        return grupo;

    }


    /* =========================================================
       GENERAR LISTA DE JUGADORES
    ========================================================= */

    function generarListaJugadores(
        equipo,
        checkboxes
    ) {

        const seleccionados = [];


        checkboxes.forEach(
            checkbox => {

                const jugador =
                    equipo.jugadores[
                        Number(
                            checkbox.value
                        )
                    ];


                if (jugador) {

                    seleccionados.push(
                        jugador
                    );

                }

            }
        );


        const grupos = {

            "Portero": [],
            "Defensa": [],
            "Centrocampista": [],
            "Delantero": []

        };


        seleccionados.forEach(
            jugador => {

                const posiciones =
                    jugador.posiciones ||
                    [];


                let grupoEncontrado =
                    null;


                for (
                    const posicion
                    of posiciones
                ) {

                    if (
                        grupos[
                            posicion
                        ]
                    ) {

                        grupoEncontrado =
                            posicion;

                        break;

                    }

                }


                if (!grupoEncontrado) {

                    grupoEncontrado =
                        "Centrocampista";

                }


                grupos[
                    grupoEncontrado
                ].push(
                    jugador
                );

            }
        );


        const izquierda =
            document.getElementById(
                "columnaIzquierda"
            );


        const derecha =
            document.getElementById(
                "columnaDerecha"
            );


        izquierda.innerHTML = "";

        derecha.innerHTML = "";


        const porteros =
            crearGrupo(
                "PORTEROS",
                grupos.Portero
            );


        const defensas =
            crearGrupo(
                "DEFENSAS",
                grupos.Defensa
            );


        const medios =
            crearGrupo(
                "MEDIOS",
                grupos.Centrocampista
            );


        const atacantes =
            crearGrupo(
                "ATACANTES",
                grupos.Delantero
            );


        if (porteros) {

            izquierda.appendChild(
                porteros
            );

        }


        if (defensas) {

            izquierda.appendChild(
                defensas
            );

        }


        if (medios) {

            derecha.appendChild(
                medios
            );

        }


        if (atacantes) {

            derecha.appendChild(
                atacantes
            );

        }

    }


    /* =========================================================
       CONFIGURACIÓN SEGÚN NÚMERO DE CONVOCADOS
       SOLO EXISTEN DOS CASOS:
       18 = PARTIDO OFICIAL
       24 = AMISTOSO
    ========================================================= */

    function aplicarConfiguracionJugadores(
        numeroJugadores
    ) {

        const convocatoria =
            document.getElementById(
                "convocatoria"
            );


        convocatoria.classList.remove(
            "config-18",
            "config-24"
        );


        if (
            numeroJugadores >= 24
        ) {

            convocatoria.classList.add(
                "config-24"
            );

        }
        else {

            convocatoria.classList.add(
                "config-18"
            );

        }

    }


    /* =========================================================
       GENERAR CONVOCATORIA
    ========================================================= */

    function generarConvocatoria() {

        const equipo =
            equipos.find(
                e =>
                    e.id ===
                    equipoSelect.value
            );


        const rival =
            rivales.find(
                r =>
                    r.id ===
                    rivalSelect.value
            );


        if (!equipo || !rival) {
            return;
        }


        /* =====================================================
           TIPO DE PARTIDO
        ===================================================== */

        const tipo =
            tipoPartidoSelect.value;


        const jornadaVisual =
            document.getElementById(
                "jornadaVisual"
            );


        if (
            tipo ===
            "amistoso"
        ) {

            jornadaVisual.textContent =
                "AMISTOSO";

        }
        else {

            const jornada =
                jornadaInput.value;


            jornadaVisual.textContent =
                jornada
                    ? `JORNADA ${jornada}`
                    : "JORNADA";

        }


        /* =====================================================
           FECHA
        ===================================================== */

        const fechaTexto =
            formatearFecha(
                fechaInput.value
            );


        document.getElementById(
            "fechaVisual"
        ).textContent =
            mayusculas(
                fechaTexto
            );


        /* =====================================================
           CAMPO + LUGAR
        ===================================================== */

        const campo =
            campoInput.value.trim();


        const lugar =
            lugarInput.value.trim();


        let campoTexto = "";


        if (
            campo &&
            lugar
        ) {

            campoTexto =
                `${campo} (${lugar})`;

        }
        else if (campo) {

            campoTexto =
                campo;

        }
        else if (lugar) {

            campoTexto =
                lugar;

        }


        document.getElementById(
            "campoVisual"
        ).innerHTML =
            `<span class="icono-ubicacion"></span>${mayusculas(campoTexto)}`;


        /* =====================================================
           EQUIPO
        ===================================================== */

        document.getElementById(
            "categoriaVisual"
        ).textContent =
            mayusculas(
                equipo.nombre
            );


        /* =====================================================
           LOCAL / VISITANTE
        ===================================================== */

        const esLocal =
            localVisitanteSelect.value ===
            "local";


        const escudoLocal =
            document.getElementById(
                "escudoLocal"
            );


        const escudoVisitante =
            document.getElementById(
                "escudoVisitante"
            );


        const nombreLocal =
            document.getElementById(
                "nombreLocal"
            );


        const nombreVisitante =
            document.getElementById(
                "nombreVisitante"
            );


        if (esLocal) {

            escudoLocal.src =
                "escudos/Las_Rozas.png";

            escudoLocal.alt =
                "Las Rozas";


            nombreLocal.textContent =
                "LAS ROZAS";


            escudoVisitante.src =
                rival.escudo;

            escudoVisitante.alt =
                rival.nombre;


            nombreVisitante.textContent =
                mayusculas(
                    rival.nombre
                );

        }
        else {

            escudoLocal.src =
                rival.escudo;

            escudoLocal.alt =
                rival.nombre;


            nombreLocal.textContent =
                mayusculas(
                    rival.nombre
                );


            escudoVisitante.src =
                "escudos/Las_Rozas.png";

            escudoVisitante.alt =
                "Las Rozas";


            nombreVisitante.textContent =
                "LAS ROZAS";

        }


        /* =====================================================
           JUGADORES
        ===================================================== */

        const checkboxes =
            jugadoresForm.querySelectorAll(
                "input[type='checkbox']:checked"
            );


        const numeroJugadores =
            checkboxes.length;


        /* =====================================================
           VALIDACIÓN DE CONVOCADOS
           PARTIDO OFICIAL = EXACTAMENTE 18
           AMISTOSO = MÁXIMO 24
        ===================================================== */

        if (
            tipo === "oficial" &&
            numeroJugadores !== 18
        ) {
            actualizarContadorConvocados();

            alert(
                numeroJugadores < 18
                    ? `No se puede generar la convocatoria. Has seleccionado ${numeroJugadores} jugadores y en un partido oficial deben ser exactamente 18.`
                    : `No se puede generar la convocatoria. Has seleccionado ${numeroJugadores} jugadores y en un partido oficial deben ser exactamente 18.`
            );

            return;
        }

        if (
            tipo === "amistoso" &&
            (
                numeroJugadores < 1 ||
                numeroJugadores > 24
            )
        ) {
            actualizarContadorConvocados();

            alert(
                numeroJugadores > 24
                    ? "No se puede generar la convocatoria. En un amistoso el máximo es de 24 jugadores."
                    : "Selecciona al menos 1 jugador para generar la convocatoria."
            );

            return;
        }


        generarListaJugadores(
            equipo,
            checkboxes
        );


        /* =====================================================
           APLICAR CONFIGURACIÓN 18 / 24
        ===================================================== */

        aplicarConfiguracionJugadores(
            numeroJugadores
        );


        /* =====================================================
           STAFF
        ===================================================== */

        document.getElementById(
            "entrenadorVisual"
        ).textContent =
            mayusculas(
                equipo.entrenador
            );


        const cuerpoTecnico =
            document.getElementById(
                "cuerpoTecnicoVisual"
            );


        if (
            equipo.cuerpoTecnico &&
            equipo.cuerpoTecnico.length
        ) {

            cuerpoTecnico.textContent =
                equipo.cuerpoTecnico
                    .join(" | ")
                    .toLocaleUpperCase(
                        "es-ES"
                    );

        }
        else {

            cuerpoTecnico.textContent =
                "";

        }


        /* =====================================================
           EQUIPACIÓN
        ===================================================== */

        const datosEquipacion =
            equipaciones.find(
                e =>
                    e.equipoId ===
                    equipo.id
            );


        if (datosEquipacion) {

            const camiseta =
                datosEquipacion.camiseta[
                    Number(
                        camisetaSelect.value
                    )
                ];


            const pantalon =
                datosEquipacion.pantalon[
                    Number(
                        pantalonSelect.value
                    )
                ];


            const medias =
                datosEquipacion.medias[
                    Number(
                        mediasSelect.value
                    )
                ];


            if (camiseta) {

                document.getElementById(
                    "camisetaVisual"
                ).src =
                    camiseta.imagen;

            }


            if (pantalon) {

                document.getElementById(
                    "pantalonVisual"
                ).src =
                    pantalon.imagen;

            }


            if (medias) {

                document.getElementById(
                    "mediasVisual"
                ).src =
                    medias.imagen;

            }

        }


        /* =====================================================
           HORARIOS
        ===================================================== */

        document.getElementById(
            "horaPartidoVisual"
        ).textContent =
            horaPartidoInput.value ||
            "--:--";


        document.getElementById(
            "horaConvocatoriaVisual"
        ).textContent =
            horaConvocatoriaInput.value ||
            "--:--";


        ajustarConvocatoria();

    }


    /* =========================================================
       INICIO
    ========================================================= */

    cargarRivales();

    cargarJugadores();

    cargarEquipacion();

    actualizarContadorConvocados();

    ajustarConvocatoria();

</script>
