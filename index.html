<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Convocatorias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        /* =========================================================
           FORMULARIO
        ========================================================= */

        .formulario {
            max-width: 900px;
            margin: 0 auto 40px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .formulario h1 {
            margin-top: 0;
        }

        .campo-form {
            margin-bottom: 18px;
        }

        .campo-form label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .campo-form input,
        .campo-form select {
            width: 100%;
            padding: 11px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .jugadores-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
        }

        .jugador-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .equipaciones-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #01408e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #012f69;
        }


        /* =========================================================
           CONVOCATORIA
           1080 x 1920
        ========================================================= */

        .convocatoria {
            width: 1080px;
            height: 1920px;
            max-width: 100%;
            margin: 0 auto;
            background: white;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.18);
        }


        /* =========================================================
           CABECERA AZUL
        ========================================================= */

        .cabecera-azul {
            height: 705px;
            min-height: 705px;
            background: #064691;
            color: white;
            text-align: center;
            position: relative;
            padding: 50px 55px 0;
            z-index: 2;
        }

        /* Jornada */

        .jornada-capsula {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 430px;
            height: 72px;
            padding: 0 45px;
            background: white;
            color: #111;
            border-radius: 45px;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 25px;
        }

        /* Fecha */

        .fecha {
            font-size: 30px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        /* Campo */

        .campo {
            font-size: 27px;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 42px;
            text-transform: uppercase;
        }

        .icono-ubicacion {
            font-size: 34px;
            vertical-align: -4px;
            margin-right: 10px;
        }

        /* Título */

        .titulo-convocatoria {
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-size: 104px;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 12px;
            transform: scaleX(0.82);
            white-space: nowrap;
        }

        .categoria {
            font-size: 31px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 43px;
        }


        /* =========================================================
           ENFRENTAMIENTO
        ========================================================= */

        .enfrentamiento {
            width: 710px;
            height: 175px;
            margin: 0 auto;
            background: white;
            border-radius: 88px;
            color: #111;
            padding: 15px 35px;
            position: relative;
        }

        .equipos {
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 90px 1fr;
            align-items: center;
            gap: 10px;
        }

        .equipo {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .equipo img {
            width: 135px;
            height: 135px;
            object-fit: contain;
        }

        .vs {
            font-size: 30px;
            font-weight: 900;
        }

        /* Nombres fuera de la cápsula */

        .nombres-equipos {
            width: 850px;
            max-width: 100%;
            margin: 20px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .nombre-equipo {
            font-size: 27px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .nombre-equipo.izquierda {
            text-align: left;
        }

        .nombre-equipo.derecha {
            text-align: right;
        }


        /* =========================================================
           DIAGONAL ENTRE AZUL Y BLANCO
        ========================================================= */

        .cabecera-azul::after {
            content: "";
            position: absolute;
            left: -2%;
            right: -2%;
            bottom: -28px;
            height: 55px;
            background: white;
            transform: rotate(-1.7deg);
            transform-origin: center;
        }


        /* =========================================================
           ZONA BLANCA
        ========================================================= */

        .zona-blanca {
            flex: 1;
            background: white;
            position: relative;
            z-index: 1;
            padding: 62px 85px 30px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .titulo-seccion {
            display: none;
        }

        .lista-jugadores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 75px;
            flex: 1;
            min-height: 0;
        }

        .columna-jugadores {
            display: flex;
            flex-direction: column;
        }

        .grupo-posicion {
            margin-bottom: 28px;
        }

        .titulo-posicion {
            color: #064691;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .jugador {
            display: grid;
            grid-template-columns: 62px 1fr;
            align-items: center;
            min-height: 58px;
        }

        .dorsal {
            color: #f12691;
            font-size: 29px;
            font-weight: 900;
            text-align: center;
        }

        .nombre-jugador {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
        }


        /* =========================================================
           STAFF
        ========================================================= */

        .staff {
            text-align: center;
            margin-top: auto;
            padding-top: 12px;
            padding-bottom: 5px;
        }

        .staff-titulo {
            color: #064691;
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .staff-nombre {
            font-size: 25px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 13px;
        }

        .staff-nombre strong {
            display: none;
        }

        .entrenador-label {
            color: #064691;
            font-size: 25px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }


        /* =========================================================
           DIAGONAL ENTRE BLANCO Y AZUL
        ========================================================= */

        .zona-blanca::after {
            content: "";
            position: absolute;
            left: -2%;
            right: -2%;
            bottom: -25px;
            height: 50px;
            background: #064691;
            transform: rotate(-1.7deg);
            transform-origin: center;
            z-index: 5;
        }


        /* =========================================================
           PIE AZUL
        ========================================================= */

        .pie-azul {
            height: 275px;
            min-height: 275px;
            background: #064691;
            color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            z-index: 4;
            padding: 30px 55px 20px;
        }


        /* =========================================================
           EQUIPACIÓN
        ========================================================= */

        .equipacion-pie {
            position: relative;
            display: flex;
            align-items: center;
        }

        .equipacion-titulo {
            display: none;
        }

        .kit-visual {
            position: absolute;
            right: 10px;
            top: 2px;
            width: 95px;
            height: 245px;
            background: white;
            border-radius: 50px;
            overflow: hidden;
        }

        .pieza-kit {
            position: absolute;
            object-fit: contain;
        }

        /*
           Las tres piezas se superponen visualmente
           dentro de la cápsula blanca.
        */

        .camiseta-kit {
            width: 88px;
            height: 88px;
            left: 4px;
            top: 8px;
            z-index: 3;
        }

        .pantalon-kit {
            width: 78px;
            height: 78px;
            left: 9px;
            top: 86px;
            z-index: 2;
        }

        .medias-kit {
            width: 82px;
            height: 82px;
            left: 7px;
            top: 154px;
            z-index: 1;
        }


        /* =========================================================
           HORARIOS
        ========================================================= */

        .horarios {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
            padding-right: 115px;
        }

        .hora-bloque {
            margin-bottom: 18px;
        }

        .hora-titulo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 7px;
            margin-bottom: 7px;
        }

        .hora {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 6px;
        }


        /* =========================================================
           MÓVIL
        ========================================================= */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                padding: 20px;
            }

            .fila {
                grid-template-columns: 1fr;
            }

            .jugadores-form {
                grid-template-columns: 1fr;
            }

            .equipaciones-form {
                grid-template-columns: 1fr;
            }

            .convocatoria {
                width: 100%;
                height: auto;
                aspect-ratio: 9 / 16;
            }

            .cabecera-azul {
                height: 36.7%;
                min-height: 0;
                padding: 2.5% 4% 0;
            }

            .jornada-capsula {
                min-width: 40%;
                height: 7%;
                font-size: 2.2vw;
                letter-spacing: 0.5vw;
                padding: 0 4%;
                margin-bottom: 2%;
            }

            .fecha {
                font-size: 1.8vw;
                margin-bottom: 1.2%;
                letter-spacing: 0.15vw;
            }

            .campo {
                font-size: 1.55vw;
                margin-bottom: 3.3%;
                letter-spacing: 0.25vw;
            }

            .icono-ubicacion {
                font-size: 2vw;
            }

            .titulo-convocatoria {
                font-size: 6.1vw;
                margin-bottom: 1%;
            }

            .categoria {
                font-size: 1.8vw;
                letter-spacing: 0.18vw;
                margin-bottom: 3.7%;
            }

            .enfrentamiento {
                width: 65%;
                height: 21%;
                border-radius: 50px;
                padding: 1%;
            }

            .equipos {
                grid-template-columns: 1fr 15% 1fr;
            }

            .equipo img {
                width: 75%;
                height: 75%;
            }

            .vs {
                font-size: 2.1vw;
            }

            .nombres-equipos {
                width: 80%;
                margin-top: 2%;
                gap: 5%;
            }

            .nombre-equipo {
                font-size: 1.55vw;
                letter-spacing: 0.25vw;
            }

            .zona-blanca {
                padding: 5% 7% 2%;
            }

            .lista-jugadores {
                column-gap: 5%;
            }

            .grupo-posicion {
                margin-bottom: 3%;
            }

            .titulo-posicion {
                font-size: 1.65vw;
                margin-bottom: 1%;
            }

            .jugador {
                grid-template-columns: 18% 1fr;
                min-height: 3.2vw;
            }

            .dorsal {
                font-size: 1.8vw;
            }

            .nombre-jugador {
                font-size: 1.65vw;
            }

            .staff {
                padding-bottom: 1%;
            }

            .staff-titulo,
            .entrenador-label {
                font-size: 1.4vw;
                margin-bottom: 0.7%;
            }

            .staff-nombre {
                font-size: 1.4vw;
                margin-bottom: 1%;
            }

            .pie-azul {
                height: 14.3%;
                min-height: 0;
                padding: 1% 5%;
            }

            .kit-visual {
                width: 45px;
                height: 115px;
                right: 0;
                top: 3px;
                border-radius: 25px;
            }

            .camiseta-kit {
                width: 43px;
                height: 43px;
                left: 1px;
                top: 3px;
            }

            .pantalon-kit {
                width: 39px;
                height: 39px;
                left: 3px;
                top: 41px;
            }

            .medias-kit {
                width: 40px;
                height: 40px;
                left: 2px;
                top: 75px;
            }

            .horarios {
                padding-right: 55px;
            }

            .hora-bloque {
                margin-bottom: 3%;
            }

            .hora-titulo {
                font-size: 1.1vw;
                letter-spacing: 0.35vw;
                margin-bottom: 1%;
            }

            .hora {
                font-size: 2.2vw;
                letter-spacing: 0.3vw;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================================
         FORMULARIO
    ========================================================= -->

    <div class="formulario">

        <h1>Generador de convocatorias</h1>

        <div class="campo-form">
            <label for="equipo">Equipo</label>
            <select id="equipo"></select>
        </div>

        <div class="fila">

            <div class="campo-form">
                <label for="tipoPartido">Tipo de partido</label>

                <select id="tipoPartido">
                    <option value="oficial">Partido oficial</option>
                    <option value="amistoso">Amistoso</option>
                </select>
            </div>

            <div class="campo-form">
                <label for="jornada">Jornada</label>

                <input
                    type="number"
                    id="jornada"
                    min="1"
                    placeholder="Ej. 22">
            </div>

        </div>


        <div class="fila">

            <div class="campo-form">
                <label for="fecha">Fecha</label>

                <input
                    type="date"
                    id="fecha">
            </div>

            <div class="campo-form">
                <label for="horaPartido">Hora del partido</label>

                <input
                    type="time"
                    id="horaPartido"
                    step="60">
            </div>

        </div>


        <div class="campo-form">

            <label for="horaConvocatoria">
                Hora de convocatoria
            </label>

            <input
                type="time"
                id="horaConvocatoria"
                step="60">

        </div>


        <div class="campo-form">

            <label for="rival">
                Rival
            </label>

            <select id="rival"></select>

        </div>


        <div class="campo-form">

            <label for="localVisitante">
                Las Rozas
            </label>

            <select id="localVisitante">

                <option value="local">
                    Local
                </option>

                <option value="visitante">
                    Visitante
                </option>

            </select>

        </div>


        <div class="fila">

            <div class="campo-form">

                <label for="campo">
                    Campo
                </label>

                <input
                    type="text"
                    id="campo"
                    placeholder="Ej. Julián Ariza">

            </div>


            <div class="campo-form">

                <label for="lugar">
                    Lugar
                </label>

                <input
                    type="text"
                    id="lugar"
                    placeholder="Ej. Torrelodones">

            </div>

        </div>


        <h3>
            Jugadores convocados
        </h3>

        <div
            id="jugadoresForm"
            class="jugadores-form">
        </div>


        <h3>
            Equipación
        </h3>

        <div class="equipaciones-form">

            <div class="campo-form">

                <label for="camiseta">
                    Camiseta
                </label>

                <select id="camiseta"></select>

            </div>


            <div class="campo-form">

                <label for="pantalon">
                    Pantalón
                </label>

                <select id="pantalon"></select>

            </div>


            <div class="campo-form">

                <label for="medias">
                    Medias
                </label>

                <select id="medias"></select>

            </div>

        </div>


        <button onclick="generarConvocatoria()">
            Generar convocatoria
        </button>

    </div>



    <!-- =========================================================
         CONVOCATORIA
    ========================================================= -->

    <div
        id="convocatoria"
        class="convocatoria">


        <!-- =====================================================
             CABECERA
        ===================================================== -->

        <div class="cabecera-azul">


            <div
                id="jornadaVisual"
                class="jornada-capsula">
                JORNADA 22
            </div>


            <div
                id="fechaVisual"
                class="fecha">
                SÁBADO 16 DE MAYO
            </div>


            <div
                id="campoVisual"
                class="campo">

                <span class="icono-ubicacion">
                    ♧
                </span>

                JULIÁN ARIZA (TORRELODONES)

            </div>


            <div class="titulo-convocatoria">
                CONVOCATORIA
            </div>


            <div
                id="categoriaVisual"
                class="categoria">
                CADETE B (AUTONÓMICA)
            </div>


            <div class="enfrentamiento">

                <div class="equipos">


                    <div class="equipo">

                        <img
                            id="escudoLocal"
                            src="escudos/Las_Rozas.png"
                            alt="Las Rozas">

                    </div>


                    <div class="vs">
                        VS
                    </div>


                    <div class="equipo">

                        <img
                            id="escudoVisitante"
                            src="escudos/Fundación_ADF.png"
                            alt="Rival">

                    </div>

                </div>

            </div>


            <div class="nombres-equipos">

                <div
                    id="nombreLocal"
                    class="nombre-equipo izquierda">
                    LAS ROZAS
                </div>

                <div
                    id="nombreVisitante"
                    class="nombre-equipo derecha">
                    FUNDACIÓN ADF 'A'
                </div>

            </div>

        </div>



        <!-- =====================================================
             ZONA BLANCA
        ===================================================== -->

        <div class="zona-blanca">


            <div
                id="listaJugadores"
                class="lista-jugadores">


                <div
                    id="columnaIzquierda"
                    class="columna-jugadores">
                </div>


                <div
                    id="columnaDerecha"
                    class="columna-jugadores">
                </div>


            </div>


            <div class="staff">


                <div class="entrenador-label">
                    ENTRENADOR
                </div>


                <div
                    id="entrenadorVisual"
                    class="staff-nombre">
                    EDUARDO CABALLERO
                </div>


                <div class="staff-titulo">
                    CUERPO TÉCNICO
                </div>


                <div
                    id="cuerpoTecnicoVisual"
                    class="staff-nombre">
                    DAVID | KIM | VALENZUELA
                </div>

            </div>

        </div>



        <!-- =====================================================
             PIE
        ===================================================== -->

        <div class="pie-azul">


            <div class="equipacion-pie">

                <div class="kit-visual">

                    <img
                        id="camisetaVisual"
                        class="pieza-kit camiseta-kit"
                        src=""
                        alt="Camiseta">

                    <img
                        id="pantalonVisual"
                        class="pieza-kit pantalon-kit"
                        src=""
                        alt="Pantalón">

                    <img
                        id="mediasVisual"
                        class="pieza-kit medias-kit"
                        src=""
                        alt="Medias">

                </div>

            </div>


            <div class="horarios">


                <div class="hora-bloque">

                    <div class="hora-titulo">
                        PARTIDO
                    </div>

                    <div
                        id="horaPartidoVisual"
                        class="hora">
                        13:30
                    </div>

                </div>


                <div class="hora-bloque">

                    <div class="hora-titulo">
                        CONVOCATORIA
                    </div>

                    <div
                        id="horaConvocatoriaVisual"
                        class="hora">
                        12:30
                    </div>

                </div>


            </div>

        </div>

    </div>



    <!-- =========================================================
         DATOS
    ========================================================= -->

    <script src="datos.js"></script>


    <script>

        /* =========================================================
           REFERENCIAS
        ========================================================= */

        const equipoSelect =
            document.getElementById("equipo");

        const tipoPartidoSelect =
            document.getElementById("tipoPartido");

        const jornadaInput =
            document.getElementById("jornada");

        const fechaInput =
            document.getElementById("fecha");

        const horaPartidoInput =
            document.getElementById("horaPartido");

        const horaConvocatoriaInput =
            document.getElementById("horaConvocatoria");

        const rivalSelect =
            document.getElementById("rival");

        const localVisitanteSelect =
            document.getElementById("localVisitante");

        const campoInput =
            document.getElementById("campo");

        const lugarInput =
            document.getElementById("lugar");

        const jugadoresForm =
            document.getElementById("jugadoresForm");

        const camisetaSelect =
            document.getElementById("camiseta");

        const pantalonSelect =
            document.getElementById("pantalon");

        const mediasSelect =
            document.getElementById("medias");


        /* =========================================================
           CARGAR EQUIPOS
        ========================================================= */

        equipos.forEach(equipo => {

            const option =
                document.createElement("option");

            option.value = equipo.id;
            option.textContent = equipo.nombre;

            equipoSelect.appendChild(option);

        });


        /* =========================================================
           CARGAR RIVALES
        ========================================================= */

        function cargarRivales() {

            rivalSelect.innerHTML = "";

            const equipoId =
                equipoSelect.value;

            rivales
                .filter(rival =>
                    rival.equipos.includes(equipoId)
                )
                .forEach(rival => {

                    const option =
                        document.createElement("option");

                    option.value = rival.id;
                    option.textContent = rival.nombre;

                    rivalSelect.appendChild(option);

                });

        }


        /* =========================================================
           CARGAR JUGADORES
        ========================================================= */

        function cargarJugadores() {

            jugadoresForm.innerHTML = "";

            const equipo =
                equipos.find(
                    e => e.id === equipoSelect.value
                );

            if (!equipo) return;


            equipo.jugadores.forEach(
                (jugador, index) => {

                    const label =
                        document.createElement("label");

                    label.className =
                        "jugador-checkbox";


                    const checkbox =
                        document.createElement("input");

                    checkbox.type = "checkbox";
                    checkbox.value = index;
                    checkbox.dataset.dorsal =
                        jugador.dorsal;


                    const texto =
                        document.createElement("span");

                    texto.textContent =
                        `${jugador.dorsal} - ${jugador.nombre}`;


                    label.appendChild(checkbox);
                    label.appendChild(texto);

                    jugadoresForm.appendChild(label);

                }
            );

        }


        /* =========================================================
           CARGAR EQUIPACIONES
        ========================================================= */

        function cargarEquipacion() {

            const equipo =
                equipaciones.find(
                    e =>
                        e.equipoId ===
                        equipoSelect.value
                );

            if (!equipo) return;


            camisetaSelect.innerHTML = "";
            pantalonSelect.innerHTML = "";
            mediasSelect.innerHTML = "";


            equipo.camiseta.forEach(
                (item, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;
                    option.textContent =
                        item.nombre;

                    camisetaSelect.appendChild(option);

                }
            );


            equipo.pantalon.forEach(
                (item, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;
                    option.textContent =
                        item.nombre;

                    pantalonSelect.appendChild(option);

                }
            );


            equipo.medias.forEach(
                (item, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;
                    option.textContent =
                        item.nombre;

                    mediasSelect.appendChild(option);

                }
            );

        }


        /* =========================================================
           CAMBIO DE EQUIPO
        ========================================================= */

        equipoSelect.addEventListener(
            "change",
            () => {

                cargarRivales();
                cargarJugadores();
                cargarEquipacion();

            }
        );


        /* =========================================================
           FORMATO FECHA
        ========================================================= */

        function formatearFecha(fecha) {

            if (!fecha) {
                return "";
            }

            const partes =
                fecha.split("-");

            const fechaObj =
                new Date(
                    partes[0],
                    partes[1] - 1,
                    partes[2]
                );

            const dias = [
                "domingo",
                "lunes",
                "martes",
                "miércoles",
                "jueves",
                "viernes",
                "sábado"
            ];

            const meses = [
                "enero",
                "febrero",
                "marzo",
                "abril",
                "mayo",
                "junio",
                "julio",
                "agosto",
                "septiembre",
                "octubre",
                "noviembre",
                "diciembre"
            ];

            return `${dias[fechaObj.getDay()]} ${fechaObj.getDate()} de ${meses[fechaObj.getMonth()]}`;

        }


        /* =========================================================
           CONVERTIR TEXTO A MAYÚSCULAS
        ========================================================= */

        function mayusculas(texto) {

            return (texto || "").toLocaleUpperCase("es-ES");

        }


        /* =========================================================
           CREAR GRUPO DE POSICIÓN
        ========================================================= */

        function crearGrupo(titulo, jugadores) {

            if (!jugadores.length) {
                return null;
            }

            const grupo =
                document.createElement("div");

            grupo.className =
                "grupo-posicion";


            const tituloElemento =
                document.createElement("div");

            tituloElemento.className =
                "titulo-posicion";

            tituloElemento.textContent =
                titulo;


            grupo.appendChild(
                tituloElemento
            );


            jugadores.forEach(
                jugador => {

                    const elemento =
                        document.createElement("div");

                    elemento.className =
                        "jugador";


                    const dorsal =
                        document.createElement("div");

                    dorsal.className =
                        "dorsal";

                    dorsal.textContent =
                        jugador.dorsal;


                    const nombre =
                        document.createElement("div");

                    nombre.className =
                        "nombre-jugador";

                    nombre.textContent =
                        mayusculas(
                            jugador.nombre
                        );


                    elemento.appendChild(
                        dorsal
                    );

                    elemento.appendChild(
                        nombre
                    );


                    grupo.appendChild(
                        elemento
                    );

                }
            );


            return grupo;

        }


        /* =========================================================
           GENERAR LISTA DE JUGADORES
        ========================================================= */

        function generarListaJugadores(
            equipo,
            checkboxes
        ) {

            const seleccionados = [];


            checkboxes.forEach(
                checkbox => {

                    const jugador =
                        equipo.jugadores[
                            Number(
                                checkbox.value
                            )
                        ];

                    if (jugador) {
                        seleccionados.push(
                            jugador
                        );
                    }

                }
            );


            const grupos = {
                "Portero": [],
                "Defensa": [],
                "Centrocampista": [],
                "Delantero": []
            };


            seleccionados.forEach(
                jugador => {

                    const posiciones =
                        jugador.posiciones ||
                        [];


                    let grupoEncontrado =
                        null;


                    for (
                        const posicion
                        of posiciones
                    ) {

                        if (
                            grupos[
                                posicion
                            ]
                        ) {

                            grupoEncontrado =
                                posicion;

                            break;

                        }

                    }


                    if (!grupoEncontrado) {

                        grupoEncontrado =
                            "Centrocampista";

                    }


                    grupos[
                        grupoEncontrado
                    ].push(jugador);

                }
            );


            const izquierda =
                document.getElementById(
                    "columnaIzquierda"
                );

            const derecha =
                document.getElementById(
                    "columnaDerecha"
                );


            izquierda.innerHTML = "";
            derecha.innerHTML = "";


            const porteros =
                crearGrupo(
                    "PORTEROS",
                    grupos.Portero
                );

            const defensas =
                crearGrupo(
                    "DEFENSAS",
                    grupos.Defensa
                );

            const medios =
                crearGrupo(
                    "MEDIOS",
                    grupos.Centrocampista
                );

            const atacantes =
                crearGrupo(
                    "ATACANTES",
                    grupos.Delantero
                );


            if (porteros) {
                izquierda.appendChild(
                    porteros
                );
            }

            if (defensas) {
                izquierda.appendChild(
                    defensas
                );
            }

            if (medios) {
                derecha.appendChild(
                    medios
                );
            }

            if (atacantes) {
                derecha.appendChild(
                    atacantes
                );
            }

        }


        /* =========================================================
           GENERAR CONVOCATORIA
        ========================================================= */

        function generarConvocatoria() {

            const equipo =
                equipos.find(
                    e =>
                        e.id ===
                        equipoSelect.value
                );


            const rival =
                rivales.find(
                    r =>
                        r.id ===
                        rivalSelect.value
                );


            if (!equipo || !rival) {
                return;
            }


            /* =====================================================
               TIPO DE PARTIDO
            ===================================================== */

            const tipo =
                tipoPartidoSelect.value;


            const jornadaVisual =
                document.getElementById(
                    "jornadaVisual"
                );


            if (tipo === "amistoso") {

                jornadaVisual.textContent =
                    "AMISTOSO";

            }
            else {

                const jornada =
                    jornadaInput.value;

                jornadaVisual.textContent =
                    jornada
                        ? `JORNADA ${jornada}`
                        : "JORNADA";

            }


            /* =====================================================
               FECHA
            ===================================================== */

            const fechaTexto =
                formatearFecha(
                    fechaInput.value
                );


            document.getElementById(
                "fechaVisual"
            ).textContent =
                mayusculas(
                    fechaTexto
                );


            /* =====================================================
               CAMPO + LUGAR
            ===================================================== */

            const campo =
                campoInput.value.trim();

            const lugar =
                lugarInput.value.trim();


            let campoTexto = "";


            if (campo && lugar) {

                campoTexto =
                    `${campo} (${lugar})`;

            }
            else if (campo) {

                campoTexto =
                    campo;

            }
            else if (lugar) {

                campoTexto =
                    lugar;

            }


            document.getElementById(
                "campoVisual"
            ).innerHTML =
                `<span class="icono-ubicacion">♧</span>${mayusculas(campoTexto)}`;


            /* =====================================================
               EQUIPO
            ===================================================== */

            document.getElementById(
                "categoriaVisual"
            ).textContent =
                mayusculas(
                    equipo.nombre
                );


            /* =====================================================
               LOCAL / VISITANTE
            ===================================================== */

            const esLocal =
                localVisitanteSelect.value ===
                "local";


            const escudoLocal =
                document.getElementById(
                    "escudoLocal"
                );

            const escudoVisitante =
                document.getElementById(
                    "escudoVisitante"
                );

            const nombreLocal =
                document.getElementById(
                    "nombreLocal"
                );

            const nombreVisitante =
                document.getElementById(
                    "nombreVisitante"
                );


            if (esLocal) {

                escudoLocal.src =
                    "escudos/Las_Rozas.png";

                escudoLocal.alt =
                    "Las Rozas";


                nombreLocal.textContent =
                    "LAS ROZAS";


                escudoVisitante.src =
                    rival.escudo;

                escudoVisitante.alt =
                    rival.nombre;


                nombreVisitante.textContent =
                    mayusculas(
                        rival.nombre
                    );

            }
            else {

                escudoLocal.src =
                    rival.escudo;

                escudoLocal.alt =
                    rival.nombre;


                nombreLocal.textContent =
                    mayusculas(
                        rival.nombre
                    );


                escudoVisitante.src =
                    "escudos/Las_Rozas.png";

                escudoVisitante.alt =
                    "Las Rozas";


                nombreVisitante.textContent =
                    "LAS ROZAS";

            }


            /* =====================================================
               JUGADORES
            ===================================================== */

            const checkboxes =
                jugadoresForm.querySelectorAll(
                    "input[type='checkbox']:checked"
                );


            generarListaJugadores(
                equipo,
                checkboxes
            );


            /* =====================================================
               STAFF
            ===================================================== */

            document.getElementById(
                "entrenadorVisual"
            ).textContent =
                mayusculas(
                    equipo.entrenador
                );


            const cuerpoTecnico =
                document.getElementById(
                    "cuerpoTecnicoVisual"
                );


            if (
                equipo.cuerpoTecnico &&
                equipo.cuerpoTecnico.length
            ) {

                cuerpoTecnico.textContent =
                    equipo.cuerpoTecnico
                        .join(" | ")
                        .toLocaleUpperCase(
                            "es-ES"
                        );

            }
            else {

                cuerpoTecnico.textContent =
                    "";

            }


            /* =====================================================
               EQUIPACIÓN
            ===================================================== */

            const datosEquipacion =
                equipaciones.find(
                    e =>
                        e.equipoId ===
                        equipo.id
                );


            if (datosEquipacion) {

                const camiseta =
                    datosEquipacion.camiseta[
                        Number(
                            camisetaSelect.value
                        )
                    ];


                const pantalon =
                    datosEquipacion.pantalon[
                        Number(
                            pantalonSelect.value
                        )
                    ];


                const medias =
                    datosEquipacion.medias[
                        Number(
                            mediasSelect.value
                        )
                    ];


                if (camiseta) {

                    document.getElementById(
                        "camisetaVisual"
                    ).src =
                        camiseta.imagen;

                }


                if (pantalon) {

                    document.getElementById(
                        "pantalonVisual"
                    ).src =
                        pantalon.imagen;

                }


                if (medias) {

                    document.getElementById(
                        "mediasVisual"
                    ).src =
                        medias.imagen;

                }

            }


            /* =====================================================
               HORARIOS
            ===================================================== */

            document.getElementById(
                "horaPartidoVisual"
            ).textContent =
                horaPartidoInput.value ||
                "--:--";


            document.getElementById(
                "horaConvocatoriaVisual"
            ).textContent =
                horaConvocatoriaInput.value ||
                "--:--";

        }


        /* =========================================================
           INICIO
        ========================================================= */

        cargarRivales();
        cargarJugadores();
        cargarEquipacion();


    </script>

</body>
</html>
