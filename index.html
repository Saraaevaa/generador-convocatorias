<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Convocatorias</title>

    <!-- Tipografía condensada para acercarnos al diseño de la plantilla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
            padding: 25px;
        }


        /* =========================================================
           CONTENEDOR GENERAL
        ========================================================= */

        .pagina {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;

            display: grid;
            grid-template-columns: minmax(420px, 520px) minmax(0, 1fr);
            gap: 35px;

            align-items: start;
        }


        /* =========================================================
           FORMULARIO
        ========================================================= */

        .formulario {
            width: 100%;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.08);
        }

        .formulario h1 {
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 30px;
        }

        .formulario h3 {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .campo-form {
            margin-bottom: 18px;
        }

        .campo-form label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .campo-form input,
        .campo-form select {
            width: 100%;

            padding: 11px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;
        }

        .fila {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }

        .jugadores-form {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px 20px;
        }

        .jugador-checkbox {
            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;
        }

        .jugador-checkbox input {
            flex-shrink: 0;
        }

        .equipaciones-form {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 7px;

            background: #01408e;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        button:hover {
            background: #012f69;
        }


        /* =========================================================
           ZONA DE PREVISUALIZACIÓN
           
           Esta caja cambia de tamaño.
           La convocatoria REAL siempre sigue siendo 1080x1920.
        ========================================================= */

        .previsualizacion {
            width: 100%;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            position: sticky;

            top: 25px;
        }

        .convocatoria-wrapper {
            position: relative;

            width: 100%;

            max-width: 560px;

            aspect-ratio: 9 / 16;

            overflow: hidden;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.18);

            background: white;
        }


        /* =========================================================
           CONVOCATORIA REAL
           
           SIEMPRE 1080 x 1920.
           Nunca cambia sus proporciones.
        ========================================================= */

        .convocatoria {
            position: absolute;

            left: 0;
            top: 0;

            width: 1080px;
            height: 1920px;

            background: white;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            transform-origin: top left;
        }


        /* =========================================================
           CABECERA AZUL
        ========================================================= */

        .cabecera-azul {
            height: 705px;

            min-height: 705px;

            background: #064691;

            color: white;

            text-align: center;

            position: relative;

            padding:
                48px
                55px
                0;

            z-index: 2;
        }


        /* =========================================================
           JORNADA
        ========================================================= */

        .jornada-capsula {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 410px;

            height: 68px;

            padding:
                0 42px;

            background: white;

            color: #111;

            border-radius: 45px;

            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 6px;

            margin-bottom: 20px;
        }


        /* =========================================================
           FECHA
        ========================================================= */

        .fecha {
            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 29px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }


        /* =========================================================
           CAMPO
        ========================================================= */

        .campo {
            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 25px;

            font-weight: 400;

            letter-spacing: 3px;

            margin-bottom: 39px;

            text-transform: uppercase;

            white-space: nowrap;
        }

        .icono-ubicacion {
            font-size: 29px;

            vertical-align: -3px;

            margin-right: 8px;
        }


        /* =========================================================
           TITULO CONVOCATORIA
        ========================================================= */

        .titulo-convocatoria {
            font-family:
                "Roboto Condensed",
                "Arial Narrow",
                Arial,
                sans-serif;

            font-size: 105px;

            line-height: 0.85;

            font-weight: 900;

            letter-spacing: -2px;

            margin-bottom: 14px;

            white-space: nowrap;
        }

        .categoria {
            font-family:
                "Roboto Condensed",
                "Arial Narrow",
                Arial,
                sans-serif;

            font-size: 29px;

            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 38px;
        }


        /* =========================================================
           ENFRENTAMIENTO
        ========================================================= */

        .enfrentamiento {
            width: 710px;

            height: 170px;

            margin: 0 auto;

            background: white;

            border-radius: 90px;

            color: #111;

            padding:
                12px 32px;

            position: relative;
        }

        .equipos {
            height: 100%;

            display: grid;

            grid-template-columns:
                1fr 85px 1fr;

            align-items: center;

            gap: 5px;
        }

        .equipo {
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .equipo img {
            width: 130px;

            height: 130px;

            object-fit: contain;
        }

        .vs {
            font-family:
                "Roboto Condensed",
                Arial,
                sans-serif;

            font-size: 29px;

            font-weight: 900;
        }


        /* =========================================================
           NOMBRES DE LOS EQUIPOS
        ========================================================= */

        .nombres-equipos {
            width: 850px;

            max-width: 100%;

            margin:
                17px auto 0;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 75px;
        }

        .nombre-equipo {
            font-family:
                "Roboto Condensed",
                "Arial Narrow",
                Arial,
                sans-serif;

            font-size: 25px;

            font-weight: 500;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            white-space: nowrap;
        }

        .nombre-equipo.izquierda {
            text-align: left;
        }

        .nombre-equipo.derecha {
            text-align: right;
        }


        /* =========================================================
           DIAGONAL AZUL / BLANCO
        ========================================================= */

        .cabecera-azul::after {
            content: "";

            position: absolute;

            left: -2%;

            right: -2%;

            bottom: -27px;

            height: 55px;

            background: white;

            transform:
                rotate(-1.7deg);

            transform-origin:
                center;
        }


        /* =========================================================
           ZONA BLANCA
        ========================================================= */

        .zona-blanca {
            flex: 1;

            background: white;

            position: relative;

            z-index: 1;

            padding:
                58px
                82px
                25px;

            display: flex;

            flex-direction: column;

            min-height: 0;
        }

        .lista-jugadores {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            column-gap: 75px;

            flex: 1;

            min-height: 0;
        }

        .columna-jugadores {
            display: flex;

            flex-direction: column;
        }

        .grupo-posicion {
            margin-bottom: 25px;
        }

        .titulo-posicion {
            color: #064691;

            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 28px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 10px;

            text-transform: uppercase;
        }

        .jugador {
            display: grid;

            grid-template-columns:
                62px 1fr;

            align-items: center;

            min-height: 56px;
        }

        .dorsal {
            color: #f12691;

            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 28px;

            font-weight: 900;

            text-align: center;
        }

        .nombre-jugador {
            font-family:
                "Roboto Condensed",
                "Arial Narrow",
                Arial,
                sans-serif;

            font-size: 28px;

            font-weight: 800;

            text-transform: uppercase;

            line-height: 1;

            white-space: nowrap;
        }


        /* =========================================================
           STAFF
        ========================================================= */

        .staff {
            text-align: center;

            margin-top: auto;

            padding-top: 10px;

            padding-bottom: 4px;
        }

        .staff-titulo {
            color: #064691;

            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 24px;

            font-weight: 900;

            margin-bottom: 8px;

            text-transform: uppercase;
        }

        .staff-nombre {
            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 24px;

            font-weight: 800;

            text-transform: uppercase;

            margin-bottom: 11px;
        }

        .entrenador-label {
            color: #064691;

            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 24px;

            font-weight: 900;

            text-transform: uppercase;

            margin-bottom: 8px;
        }


        /* =========================================================
           DIAGONAL BLANCO / AZUL
        ========================================================= */

        .zona-blanca::after {
            content: "";

            position: absolute;

            left: -2%;

            right: -2%;

            bottom: -25px;

            height: 50px;

            background: #064691;

            transform:
                rotate(-1.7deg);

            transform-origin:
                center;

            z-index: 5;
        }


        /* =========================================================
           PIE AZUL
        ========================================================= */

        .pie-azul {
            height: 275px;

            min-height: 275px;

            background: #064691;

            color: white;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            position: relative;

            z-index: 4;

            padding:
                30px
                55px
                20px;
        }


        /* =========================================================
           EQUIPACIÓN
        ========================================================= */

        .equipacion-pie {
            position: relative;

            display: flex;

            align-items: center;
        }

        .kit-visual {
            position: absolute;

            left: 40px;

            top: 0;

            width: 105px;

            height: 245px;

            background: white;

            border-radius: 55px;

            overflow: hidden;
        }

        .pieza-kit {
            position: absolute;

            object-fit: contain;
        }

        .camiseta-kit {
            width: 96px;

            height: 96px;

            left: 4px;

            top: 7px;

            z-index: 3;
        }

        .pantalon-kit {
            width: 84px;

            height: 84px;

            left: 10px;

            top: 87px;

            z-index: 2;
        }

        .medias-kit {
            width: 88px;

            height: 88px;

            left: 8px;

            top: 157px;

            z-index: 1;
        }


        /* =========================================================
           HORARIOS
        ========================================================= */

        .horarios {
            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: flex-end;

            text-align: right;

            padding-right: 75px;
        }

        .hora-bloque {
            margin-bottom: 17px;
        }

        .hora-titulo {
            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 6px;

            margin-bottom: 6px;
        }

        .hora {
            font-family:
                "Roboto Condensed",
                Arial Narrow,
                Arial,
                sans-serif;

            font-size: 38px;

            font-weight: 900;

            letter-spacing: 5px;
        }


        /* =========================================================
           PANTALLAS PEQUEÑAS
           
           IMPORTANTE:
           NO modificamos las proporciones de la convocatoria.
           Solo cambiamos la disposición de formulario + preview.
        ========================================================= */

        @media (max-width: 1050px) {

            body {
                padding: 15px;
            }

            .pagina {
                grid-template-columns: 1fr;

                gap: 25px;
            }

            .formulario {
                max-width: 800px;

                margin: 0 auto;
            }

            .previsualizacion {
                position: relative;

                top: auto;
            }

            .convocatoria-wrapper {
                max-width: 600px;
            }
        }


        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                padding: 20px;
            }

            .formulario h1 {
                font-size: 25px;
            }

            .fila {
                grid-template-columns: 1fr;
            }

            .jugadores-form {
                grid-template-columns: 1fr;
            }

            .equipaciones-form {
                grid-template-columns: 1fr;
            }

            .convocatoria-wrapper {
                width: 100%;
                max-width: 100%;
            }
        }

\n        /* ===== AJUSTE VISUAL FINAL · PLANTILLA LAS ROZAS ===== */\n        .cabecera-azul {\n            height: 720px;\n            min-height: 720px;\n            padding: 42px 55px 0;\n            background: #01408e;\n        }\n\n        .jornada-capsula {\n            min-width: 430px;\n            height: 70px;\n            padding: 0 48px;\n            border-radius: 38px;\n            font-size: 35px;\n            letter-spacing: 5px;\n            margin-bottom: 18px;\n        }\n\n        .fecha {\n            font-size: 30px;\n            letter-spacing: 2.5px;\n            margin-bottom: 13px;\n        }\n\n        .campo {\n            font-size: 25px;\n            letter-spacing: 2.5px;\n            margin-bottom: 37px;\n        }\n\n        .icono-ubicacion {\n            display: inline-block;\n            font-size: 0;\n            width: 20px;\n            height: 25px;\n            margin-right: 8px;\n            position: relative;\n            vertical-align: -5px;\n        }\n\n        .icono-ubicacion::before {\n            content: '';\n            position: absolute;\n            width: 16px;\n            height: 16px;\n            left: 2px;\n            top: 1px;\n            border: 3px solid white;\n            border-radius: 50% 50% 50% 0;\n            transform: rotate(-45deg);\n        }\n\n        .icono-ubicacion::after {\n            content: '';\n            position: absolute;\n            width: 5px;\n            height: 5px;\n            left: 7.5px;\n            top: 6.5px;\n            background: white;\n            border-radius: 50%;\n        }\n\n        .titulo-convocatoria {\n            font-size: 108px;\n            line-height: .84;\n            letter-spacing: -3px;\n            margin-bottom: 13px;\n            transform: scaleX(.91);\n        }\n\n        .categoria {\n            font-size: 30px;\n            letter-spacing: 2.5px;\n            margin-bottom: 34px;\n        }\n\n        .enfrentamiento {\n ght: 248px;\n            border-radius: 58px;\n        }\n\n        .camiseta-kit {\n            width: 103px;\n            height: 103px;\n            left: 4px;\n            top: 5px;\n        }\n\n        .pantalon-kit {\n            width: 91px;\n            height: 91px;\n            left: 10px;\n            top: 84px;\n        }\n\n        .medias-kit {\n            width: 94px;\n            height: 94px;\n            left: 9px;\n            top: 154px;\n        }\n\n        .horarios {\n            padding-right: 65px;\n        }\n\n        .hora-bloque {\n            margin-bottom: 15px;\n        }\n\n        .hora-titulo {\n            font-size: 18px;\n            letter-spacing: 5px;\n            margin-bottom: 5px;\n        }\n\n        .hora {\n            font-size: 39px;\n            letter-spacing: 4px;\n        }\n
    </style>
</head>


<body>


    <!-- =========================================================
         PÁGINA GENERAL
    ========================================================= -->

    <div class="pagina">


        <!-- =====================================================
             FORMULARIO
        ===================================================== -->

        <div class="formulario">

            <h1>
                Generador de convocatorias
            </h1>


            <div class="campo-form">

                <label for="equipo">
                    Equipo
                </label>

                <select id="equipo"></select>

            </div>


            <div class="fila">

                <div class="campo-form">

                    <label for="tipoPartido">
                        Tipo de partido
                    </label>

                    <select id="tipoPartido">

                        <option value="oficial">
                            Partido oficial
                        </option>

                        <option value="amistoso">
                            Amistoso
                        </option>

                    </select>

                </div>


                <div class="campo-form">

                    <label for="jornada">
                        Jornada
                    </label>

                    <input
                        type="number"
                        id="jornada"
                        min="1"
                        placeholder="Ej. 22">

                </div>

            </div>


            <div class="fila">

                <div class="campo-form">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input
                        type="date"
                        id="fecha">

                </div>


                <div class="campo-form">

                    <label for="horaPartido">
                        Hora del partido
                    </label>

                    <input
                        type="time"
                        id="horaPartido"
                        step="60">

                </div>

            </div>


            <div class="campo-form">

                <label for="horaConvocatoria">
                    Hora de convocatoria
                </label>

                <input
                    type="time"
                    id="horaConvocatoria"
                    step="60">

            </div>


            <div class="campo-form">

                <label for="rival">
                    Rival
                </label>

                <select id="rival"></select>

            </div>


            <div class="campo-form">

                <label for="localVisitante">
                    Las Rozas
                </label>

                <select id="localVisitante">

                    <option value="local">
                        Local
                    </option>

                    <option value="visitante">
                        Visitante
                    </option>

                </select>

            </div>


            <div class="fila">

                <div class="campo-form">

                    <label for="campo">
                        Campo
                    </label>

                    <input
                        type="text"
                        id="campo"
                        placeholder="Ej. Julián Ariza">

                </div>


                <div class="campo-form">

                    <label for="lugar">
                        Lugar
                    </label>

                    <input
                        type="text"
                        id="lugar"
                        placeholder="Ej. Torrelodones">

                </div>

            </div>


            <h3>
                Jugadores convocados
            </h3>


            <div
                id="jugadoresForm"
                class="jugadores-form">
            </div>


            <h3>
                Equipación
            </h3>


            <div class="equipaciones-form">

                <div class="campo-form">

                    <label for="camiseta">
                        Camiseta
                    </label>

                    <select id="camiseta"></select>

                </div>


                <div class="campo-form">

                    <label for="pantalon">
                        Pantalón
                    </label>

                    <select id="pantalon"></select>

                </div>


                <div class="campo-form">

                    <label for="medias">
                        Medias
                    </label>

                    <select id="medias"></select>

                </div>

            </div>


            <button onclick="generarConvocatoria()">
                Generar convocatoria
            </button>

        </div>



        <!-- =====================================================
             PREVISUALIZACIÓN
        ===================================================== -->

        <div class="previsualizacion">


            <div
                id="convocatoriaWrapper"
                class="convocatoria-wrapper">


                <div
                    id="convocatoria"
                    class="convocatoria">


                    <!-- =========================================
                         CABECERA
                    ========================================== -->

                    <div class="cabecera-azul">


                        <div
                            id="jornadaVisual"
                            class="jornada-capsula">

                            JORNADA 22

                        </div>


                        <div
                            id="fechaVisual"
                            class="fecha">

                            SÁBADO 16 DE MAYO

                        </div>


                        <div
                            id="campoVisual"
                            class="campo">

                            <span class="icono-ubicacion">
                                ♧
                            </span>

                            JULIÁN ARIZA (TORRELODONES)

                        </div>


                        <div class="titulo-convocatoria">

                            CONVOCATORIA

                        </div>


                        <div
                            id="categoriaVisual"
                            class="categoria">

                            CADETE B (AUTONÓMICA)

                        </div>


                        <div class="enfrentamiento">


                            <div class="equipos">


                                <div class="equipo">

                                    <img
                                        id="escudoLocal"
                                        src="escudos/Las_Rozas.png"
                                        alt="Las Rozas">

                                </div>


                                <div class="vs">

                                <div class="equipo">

                        <div class="nombres-equipos">

                            <div
                                id="nombreVisitante"
                                class="nombre-equipo derecha">

                                FUNDACIÓN ADF 'A'

                    </div>



                    <!-- =========================================
                         ZONA BLANCA

                    <div class="zona-blanca">


                        <div
                            id="listaJugadores"
                            class="lista-jugadores">


                            <div

                                class="columna-jugadores">
                            </div>


                            <div
                                id="columnaDerecha"
                                class="columna-jugadores">
                            </div>


                        </div>


                        <div class="staff">


                            <div class="entrenador-label">
                                ENTRENADOR
                            </div>


                            <div
                                id="entrenadorVisual"
                                class="staff-nombre">

                                EDUARDO CABALLERO

                            </div>


                            <div class="staff-titulo">
                                CUERPO TÉCNICO
                            </div>


                            <div
                                id="cuerpoTecnicoVisual"
                                class="staff-nombre">

                                DAVID | KIM | VALENZUELA

                            </div>


                        </div>

                    </div>



                    <!-- =========================================
                         PIE AZUL
                    ========================================== -->

                    <div class="pie-azul">


                        <div class="equipacion-pie">


                            <div class="kit-visual">


                                <img
                                    id="camisetaVisual"
                                    class="pieza-kit camiseta-kit"
                                    src=""
                                    alt="Camiseta">


                                <img
                                    id="pantalonVisual"
                                    class="pieza-kit pantalon-kit"
                                    src=""
                                    alt="Pantalón">


                                <img
                                    id="mediasVisual"
                                    class="pieza-kit medias-kit"
                                    src=""
                                    alt="Medias">


                            </div>

                        </div>


                        <div class="horarios">


                            <div class="hora-bloque">

                                <div class="hora-titulo">
                                    PARTIDO
                                </div>


                                <div
                                    id="horaPartidoVisual"
                                    class="hora">

                                    13:30

                                </div>

                            </div>


                            <div class="hora-bloque">

                                <div class="hora-titulo">
                                    CONVOCATORIA

            </div>

    <!-- =========================================================
         DATOS
    ========================================================= -->

    <script src="datos.js"></script>


    <script>

        /* =========================================================
           REFERENCIAS
        ========================================================= */

        const equipoSelect =
            document.getElementById("equipo");

        const tipoPartidoSelect =
            document.getElementById("tipoPartido");

        const jornadaInput =
            document.getElementById("jornada");

        const fechaInput =
            document.getElementById("fecha");

        const horaPartidoInput =
            document.getElementById("horaPartido");

        const horaConvocatoriaInput =
            document.getElementById("horaConvocatoria");

        const rivalSelect =
            document.getElementById("rival");

        const localVisitanteSelect =
            document.getElementById("localVisitante");

        const campoInput =
            document.getElementById("campo");

        const lugarInput =
            document.getElementById("lugar");

        const jugadoresForm =
            document.getElementById("jugadoresForm");

        const camisetaSelect =
            document.getElementById("camiseta");

        const pantalonSelect =
            document.getElementById("pantalon");

        const mediasSelect =
            document.getElementById("medias");


        /* =========================================================
           ESCALADO DE LA CONVOCATORIA
           
           La convocatoria real SIEMPRE mide 1080x1920.

           Aquí solamente calculamos cuánto debe verse en pantalla
           para que quepa completa.
        ========================================================= */

        function ajustarConvocatoria() {

            const wrapper =
                document.getElementById(
                    "convocatoriaWrapper"
                );

            const canvas =
                document.getElementById(
                    "convocatoria"
                );


            if (!wrapper || !canvas) {
                return;
            }


            /*
               Ancho máximo que queremos utilizar.

               En ordenador la convocatoria no ocupará toda
               la pantalla.
            */

            let anchoDisponible =
                Math.min(
                    560,
                    window.innerWidth
                );


            /*
               Altura disponible.

               Dejamos unos 50 px de margen para que la
               convocatoria pueda verse completa.
            */

            const alturaDisponible =
                Math.max(
                    300,
                    window.innerHeight - 50
                );


            /*
               Calculamos el tamaño máximo según el ancho.
            */

            let escalaPorAncho =
                anchoDisponible / 1080;


            /*
               Calculamos el tamaño máximo según la altura.
            */

            let escalaPorAltura =
                alturaDisponible / 1920;


            /*
               Utilizamos el menor de los dos.

               Así NUNCA se sale de la pantalla.
            */

            let escala =
                Math.min(
                    escalaPorAncho,
                    escalaPorAltura,
                    1
                );


            /*
               Tamaño visual final.
            */

            const anchoVisual =
                1080 * escala;

            const altoVisual =
                1920 * escala;


            /*
               Aplicamos el tamaño al contenedor.
            */

            wrapper.style.width =
                `${anchoVisual}px`;

            wrapper.style.height =
                `${altoVisual}px`;


            /*
               Escalamos la convocatoria completa.

               TODOS sus elementos mantienen sus
               posiciones originales.
            */

            canvas.style.transform =
                `scale(${escala})`;

        }


        window.addEventListener(
            "resize",
            ajustarConvocatoria
        );


        /* =========================================================
           CARGAR EQUIPOS
        ========================================================= */

        equipos.forEach(
            equipo => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    equipo.id;

                option.textContent =
                    equipo.nombre;

                equipoSelect.appendChild(
                    option
                );

            }
        );


        /* =========================================================
           CARGAR RIVALES
        ========================================================= */

        function cargarRivales() {

            rivalSelect.innerHTML = "";

            const equipoId =
                equipoSelect.value;


            rivales
                .filter(
                    rival =>
                        rival.equipos.includes(
                            equipoId
                        )
                )
                .forEach(
                    rival => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            rival.id;

                        option.textContent =
                            rival.nombre;

                        rivalSelect.appendChild(
                            option
                        );

                    }
                );

        }


        /* =========================================================
           CARGAR JUGADORES
        ========================================================= */

        function cargarJugadores() {

            jugadoresForm.innerHTML = "";


            const equipo =
                equipos.find(
                    e =>
                        e.id ===
                        equipoSelect.value
                );


            if (!equipo) {
                return;
            }


            equipo.jugadores.forEach(
                (
                    jugador,
                    index
                ) => {

                    const label =
                        document.createElement(
                            "label"
                        );

                    label.className =
                        "jugador-checkbox";


                    const checkbox =
                        document.createElement(
                            "input"
                        );

                    checkbox.type =
                        "checkbox";

                    checkbox.value =
                        index;

                    checkbox.dataset.dorsal =
                        jugador.dorsal;


                    const texto =
                        document.createElement(
                            "span"
                        );

                    texto.textContent =
                        `${jugador.dorsal} - ${jugador.nombre}`;


                    label.appendChild(
                        checkbox
                    );

                    label.appendChild(
                        texto
                    );


                    jugadoresForm.appendChild(
                        label
                    );

                }
            );

        }


        /* =========================================================
           CARGAR EQUIPACIONES
        ========================================================= */

        function cargarEquipacion() {

            const equipo =
                equipaciones.find(
                    e =>
                        e.equipoId ===
                        equipoSelect.value
                );


            if (!equipo) {
                return;
            }


            camisetaSelect.innerHTML = "";

            pantalonSelect.innerHTML = "";

            mediasSelect.innerHTML = "";


            equipo.camiseta.forEach(
                (
                    item,
                    index
                ) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        index;

                    option.textContent =
                        item.nombre;

                    camisetaSelect.appendChild(
                        option
                    );

                }
            );


            equipo.pantalon.forEach(
                (
                    item,
                    index
                ) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        index;

                    option.textContent =
                        item.nombre;

                    pantalonSelect.appendChild(
                        option
                    );

                }
            );


            equipo.medias.forEach(
                (
                    item,
                    index
                ) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        index;

                    option.textContent =
                        item.nombre;

                    mediasSelect.appendChild(
                        option
                    );

                }
            );

        }


        /* =========================================================
           CAMBIO DE EQUIPO
        ========================================================= */

        equipoSelect.addEventListener(
            "change",
            () => {

                cargarRivales();

                cargarJugadores();

                cargarEquipacion();

            }
        );


        /* =========================================================
           FORMATO FECHA
        ========================================================= */

        function formatearFecha(
            fecha
        ) {

            if (!fecha) {
                return "";
            }


            const partes =
                fecha.split("-");


            const fechaObj =
                new Date(
                    partes[0],
                    partes[1] - 1,
                    partes[2]
                );


            const dias = [
                "domingo",
                "lunes",
                "martes",
                "miércoles",
                "jueves",
                "viernes",
                "sábado"
            ];


            const meses = [
                "enero",
                "febrero",
                "marzo",
                "abril",
                "mayo",
                "junio",
                "julio",
                "agosto",
                "septiembre",
                "octubre",
                "noviembre",
                "diciembre"
            ];


            return `${dias[fechaObj.getDay()]} ${fechaObj.getDate()} de ${meses[fechaObj.getMonth()]}`;

        }


        /* =========================================================
           MAYÚSCULAS
        ========================================================= */

        function mayusculas(
            texto
        ) {

            return (
                texto || ""
            ).toLocaleUpperCase(
                "es-ES"
            );

        }


        /* =========================================================
           CREAR GRUPO DE POSICIÓN
        ========================================================= */

        function crearGrupo(
            titulo,
            jugadores
        ) {

            if (!jugadores.length) {
                return null;
            }


            const grupo =
                document.createElement(
                    "div"
                );

            grupo.className =
                "grupo-posicion";


            const tituloElemento =
                document.createElement(
                    "div"
                );

            tituloElemento.className =
                "titulo-posicion";

            tituloElemento.textContent =
                titulo;


            grupo.appendChild(
                tituloElemento
            );


            jugadores.forEach(
                jugador => {

                    const elemento =
                        document.createElement(
                            "div"
                        );

                    elemento.className =
                        "jugador";


                    const dorsal =
                        document.createElement(
                            "div"
                        );

                    dorsal.className =
                        "dorsal";

                    dorsal.textContent =
                        jugador.dorsal;


                    const nombre =
                        document.createElement(
                            "div"
                        );

                    nombre.className =
                        "nombre-jugador";

                    nombre.textContent =
                        mayusculas(
                            jugador.nombre
                        );


                    elemento.appendChild(
                        dorsal
                    );

                    elemento.appendChild(
                        nombre
                    );


                    grupo.appendChild(
                        elemento
                    );

                }
            );


            return grupo;

        }


        /* =========================================================
           GENERAR LISTA DE JUGADORES
        ========================================================= */

        function generarListaJugadores(
            equipo,
            checkboxes
        ) {

            const seleccionados = [];


            checkboxes.forEach(
                checkbox => {

                    const jugador =
                        equipo.jugadores[
                            Number(
                                checkbox.value
                            )
                        ];


                    if (jugador) {

                        seleccionados.push(
                            jugador
                        );

                    }

                }
            );


            const grupos = {

                "Portero": [],

                "Defensa": [],

                "Centrocampista": [],

                "Delantero": []

            };


            seleccionados.forEach(
                jugador => {

                    const posiciones =
                        jugador.posiciones ||
                        [];


                    let grupoEncontrado =
                        null;


                    for (
                        const posicion
                        of posiciones
                    ) {

                        if (
                            grupos[
                                posicion
                            ]
                        ) {

                            grupoEncontrado =
                                posicion;

                            break;

                        }

                    }


                    if (!grupoEncontrado) {

                        grupoEncontrado =
                            "Centrocampista";

                    }


                    grupos[
                        grupoEncontrado
                    ].push(
                        jugador
                    );

                }
            );


            const izquierda =
                document.getElementById(
                    "columnaIzquierda"
                );


            const derecha =
                document.getElementById(
                    "columnaDerecha"
                );


            izquierda.innerHTML = "";

            derecha.innerHTML = "";


            const porteros =
                crearGrupo(
                    "PORTEROS",
                    grupos.Portero
                );


            const defensas =
                crearGrupo(
                    "DEFENSAS",
                    grupos.Defensa
                );


            const medios =
                crearGrupo(
                    "MEDIOS",
                    grupos.Centrocampista
                );


            const atacantes =
                crearGrupo(
                    "ATACANTES",
                    grupos.Delantero
                );


            if (porteros) {

                izquierda.appendChild(
                    porteros
                );

            }


            if (defensas) {

                izquierda.appendChild(
                    defensas
                );

            }


            if (medios) {

                derecha.appendChild(
                    medios
                );

            }


            if (atacantes) {

                derecha.appendChild(
                    atacantes
                );

            }

        }


        /* =========================================================
           GENERAR CONVOCATORIA
        ========================================================= */

        function generarConvocatoria() {

            const equipo =
                equipos.find(
                    e =>
                        e.id ===
                        equipoSelect.value
                );


            const rival =
                rivales.find(
                    r =>
                        r.id ===
                        rivalSelect.value
                );


            if (!equipo || !rival) {
                return;
            }


            /* =====================================================
               TIPO DE PARTIDO
            ===================================================== */

            const tipo =
                tipoPartidoSelect.value;


            const jornadaVisual =
                document.getElementById(
                    "jornadaVisual"
                );


            if (
                tipo ===
                "amistoso"
            ) {

                jornadaVisual.textContent =
                    "AMISTOSO";

            }
            else {

                const jornada =
                    jornadaInput.value;


                jornadaVisual.textContent =
                    jornada
                        ? `JORNADA ${jornada}`
                        : "JORNADA";

            }


            /* =====================================================
               FECHA
            ===================================================== */

            const fechaTexto =
                formatearFecha(
                    fechaInput.value
                );


            document.getElementById(
                "fechaVisual"
            ).textContent =
                mayusculas(
                    fechaTexto
                );


            /* =====================================================
               CAMPO + LUGAR
            ===================================================== */

            const campo =
                campoInput.value.trim();


            const lugar =
                lugarInput.value.trim();


            let campoTexto = "";


            if (
                campo &&
                lugar
            ) {

                campoTexto =
                    `${campo} (${lugar})`;

            }
            else if (campo) {

                campoTexto =
                    campo;

            }
            else if (lugar) {

                campoTexto =
                    lugar;

            }


            document.getElementById(
                "campoVisual"
            ).innerHTML =
                `<span class="icono-ubicacion">♧</span>${mayusculas(campoTexto)}`;


            /* =====================================================
               EQUIPO
            ===================================================== */

            document.getElementById(
                "categoriaVisual"
            ).textContent =
                mayusculas(
                    equipo.nombre
                );


            /* =====================================================
               LOCAL / VISITANTE
            ===================================================== */

            const esLocal =
                localVisitanteSelect.value ===
                "local";


            const escudoLocal =
                document.getElementById(
                    "escudoLocal"
                );


            const escudoVisitante =
                document.getElementById(
                    "escudoVisitante"
                );


            const nombreLocal =
                document.getElementById(
                    "nombreLocal"
                );


            const nombreVisitante =
                document.getElementById(
                    "nombreVisitante"
                );


            if (esLocal) {

                escudoLocal.src =
                    "escudos/Las_Rozas.png";

                escudoLocal.alt =
                    "Las Rozas";


                nombreLocal.textContent =
                    "LAS ROZAS";


                escudoVisitante.src =
                    rival.escudo;

                escudoVisitante.alt =
                    rival.nombre;


                nombreVisitante.textContent =
                    mayusculas(
                        rival.nombre
                    );

            }
            else {

                escudoLocal.src =
                    rival.escudo;

                escudoLocal.alt =
                    rival.nombre;


                nombreLocal.textContent =
                    mayusculas(
                        rival.nombre
                    );


                escudoVisitante.src =
                    "escudos/Las_Rozas.png";

                escudoVisitante.alt =
                    "Las Rozas";


                nombreVisitante.textContent =
                    "LAS ROZAS";

            }


            /* =====================================================
               JUGADORES
            ===================================================== */

            const checkboxes =
                jugadoresForm.querySelectorAll(
                    "input[type='checkbox']:checked"
                );


            generarListaJugadores(
                equipo,
                checkboxes
            );


            /* =====================================================
               STAFF
            ===================================================== */

            document.getElementById(
                "entrenadorVisual"
            ).textContent =
                mayusculas(
                    equipo.entrenador
                );


            const cuerpoTecnico =
                document.getElementById(
                    "cuerpoTecnicoVisual"
                );


            if (
                equipo.cuerpoTecnico &&
                equipo.cuerpoTecnico.length
            ) {

                cuerpoTecnico.textContent =
                    equipo.cuerpoTecnico
                        .join(" | ")
                        .toLocaleUpperCase(
                            "es-ES"
                        );

            }
            else {

                cuerpoTecnico.textContent =
                    "";

            }


            /* =====================================================
               EQUIPACIÓN
            ===================================================== */

            const datosEquipacion =
                equipaciones.find(
                    e =>
                        e.equipoId ===
                        equipo.id
                );


            if (datosEquipacion) {

                const camiseta =
                    datosEquipacion.camiseta[
                        Number(
                            camisetaSelect.value
                        )
                    ];


                const pantalon =
                    datosEquipacion.pantalon[
                        Number(
                            pantalonSelect.value
                        )
                    ];


                const medias =
                    datosEquipacion.medias[
                        Number(
                            mediasSelect.value
                        )
                    ];


                if (camiseta) {

                    document.getElementById(
                        "camisetaVisual"
                    ).src =
                        camiseta.imagen;

                }


                if (pantalon) {

                    document.getElementById(
                        "pantalonVisual"
                    ).src =
                        pantalon.imagen;

                }


                if (medias) {

                    document.getElementById(
                        "mediasVisual"
                    ).src =
                        medias.imagen;

                }

            }


            /* =====================================================
               HORARIOS
            ===================================================== */

            document.getElementById(
                "horaPartidoVisual"
            ).textContent =
                horaPartidoInput.value ||
                "--:--";


            document.getElementById(
                "horaConvocatoriaVisual"
            ).textContent =
                horaConvocatoriaInput.value ||
                "--:--";


            /*
               Recalculamos el tamaño por si la generación
               ha cambiado alguna cosa visual.
            */

            ajustarConvocatoria();

        }


        /* =========================================================
           INICIO
        ========================================================= */

        cargarRivales();

        cargarJugadores();

        cargarEquipacion();

        ajustarConvocatoria();


    </script>
