<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Convocatorias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f1f1;
            color: #111;
        }

        .contenedor {
            width: min(1200px, 95%);
            margin: 30px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .formulario {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .fila {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        .seccion {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .seccion h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .contador {
            margin-bottom: 12px;
            font-weight: bold;
        }

        .jugadores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .jugador {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #fafafa;
        }

        .jugador:hover {
            background: #f0f0f0;
        }

        .jugador input {
            width: auto;
        }

        .datos-jugador {
            display: flex;
            flex-direction: column;
        }

        .nombre-jugador {
            font-weight: bold;
        }

        .posiciones {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .equipaciones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #resultado {
            display: none;
            margin-top: 30px;
        }

        .convocatoria {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 1px solid #ddd;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .cabecera {
            background: #000;
            color: white;
            text-align: center;
            padding: 18px;
        }

        .cabecera-titulo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .jornada {
            margin-top: 8px;
            font-size: 18px;
        }

        .equipos {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            padding: 30px 25px 20px;
        }

        .equipo {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .equipo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .vs {
            font-size: 22px;
            font-weight: bold;
        }

        .datos-partido {
            text-align: center;
            padding: 0 25px 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        /*
        =========================
        EQUIPACIÓN VISUAL
        =========================
        */

        .equipacion-resultado {
            padding: 20px 25px;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .equipacion-titulo {
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .equipacion-visual {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            gap: 15px;
        }

        .pieza-equipacion {
            text-align: center;
        }

        .pieza-equipacion img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .pieza-nombre {
            margin-top: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }

        .jugadores-resultado {
            padding: 20px 25px;
        }

        .jugadores-resultado h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .lista-jugadores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 15px;
        }

        .jugador-resultado {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 5px;
        }

        .dorsal {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .nombre-resultado {
            font-weight: bold;
        }

        .posiciones-resultado {
            font-size: 11px;
            color: #777;
        }

        .cuerpo-tecnico {
            padding: 20px 25px;
            border-top: 1px solid #ddd;
        }

        .cuerpo-tecnico h3 {
            text-align: center;
            margin-top: 0;
        }

        .tecnico {
            text-align: center;
            margin: 5px 0;
        }

        .pie {
            background: #000;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {

            .fila,
            .equipaciones,
            .jugadores,
            .lista-jugadores {
                grid-template-columns: 1fr;
            }

            .equipacion-visual {
                gap: 5px;
            }

            .pieza-equipacion img {
                height: 80px;
            }

            .equipos {
                gap: 10px;
            }

            .equipo {
                font-size: 17px;
            }

            .equipo img {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Generador de Convocatorias</h1>

    <div class="formulario">

        <div class="fila">

            <div class="campo">
                <label for="equipo">Equipo</label>
                <select id="equipo">
                    <option value="">Selecciona un equipo</option>
                </select>
            </div>

            <div class="campo">
                <label for="tipoPartido">Tipo de partido</label>
                <select id="tipoPartido">
                    <option value="oficial">Partido oficial</option>
                    <option value="amistoso">Amistoso</option>
                </select>
            </div>

        </div>


        <div class="fila">

            <div class="campo">
                <label for="jornada">Jornada</label>

                <input
                    type="number"
                    id="jornada"
                    min="1"
                    placeholder="Introduce la jornada"
                >
            </div>

            <div class="campo">
                <label for="fecha">Fecha</label>

                <input
                    type="date"
                    id="fecha"
                >
            </div>

        </div>


        <div class="fila">

            <div class="campo">
                <label for="rival">Rival</label>

                <select id="rival">
                    <option value="">Selecciona un rival</option>
                </select>
            </div>

            <div class="campo">
                <label for="localVisitante">Las Rozas</label>

                <select id="localVisitante">
                    <option value="local">Local</option>
                    <option value="visitante">Visitante</option>
                </select>
            </div>

        </div>


        <div class="fila">

            <div class="campo">
                <label for="campo">Campo</label>

                <input
                    type="text"
                    id="campo"
                    placeholder="Ej. Julián Ariza"
                >
            </div>

            <div class="campo">
                <label for="lugar">Lugar</label>

                <input
                    type="text"
                    id="lugar"
                    placeholder="Ej. Torrelodones"
                >
            </div>

        </div>


        <div class="seccion">

            <h2>Jugadores</h2>

            <div class="contador">
                Seleccionados:
                <span id="contador">0</span>
            </div>

            <div
                id="listaJugadores"
                class="jugadores"
            ></div>

        </div>


        <div class="seccion">

            <h2>Equipación</h2>

            <div class="equipaciones">

                <div class="campo">

                    <label for="camiseta">
                        Camiseta
                    </label>

                    <select id="camiseta"></select>

                </div>


                <div class="campo">

                    <label for="pantalon">
                        Pantalón
                    </label>

                    <select id="pantalon"></select>

                </div>


                <div class="campo">

                    <label for="medias">
                        Medias
                    </label>

                    <select id="medias"></select>

                </div>

            </div>

        </div>


        <button id="generar">
            GENERAR CONVOCATORIA
        </button>

    </div>


    <div id="resultado"></div>

</div>


<script src="datos.js"></script>


<script>

/* =========================
   ELEMENTOS
========================= */

const equipoSelect =
    document.getElementById("equipo");

const tipoPartidoSelect =
    document.getElementById("tipoPartido");

const jornadaInput =
    document.getElementById("jornada");

const fechaInput =
    document.getElementById("fecha");

const rivalSelect =
    document.getElementById("rival");

const localVisitanteSelect =
    document.getElementById("localVisitante");

const listaJugadores =
    document.getElementById("listaJugadores");

const contador =
    document.getElementById("contador");

const camisetaSelect =
    document.getElementById("camiseta");

const pantalonSelect =
    document.getElementById("pantalon");

const mediasSelect =
    document.getElementById("medias");

const generarButton =
    document.getElementById("generar");

const resultado =
    document.getElementById("resultado");


/* =========================
   CARGAR EQUIPOS
========================= */

equipos.forEach(equipo => {

    const option =
        document.createElement("option");

    option.value = equipo.id;
    option.textContent = equipo.nombre;

    equipoSelect.appendChild(option);

});


/* =========================
   CAMBIO DE EQUIPO
========================= */

equipoSelect.addEventListener(
    "change",
    () => {

        const equipoId =
            equipoSelect.value;

        cargarRivales(equipoId);
        cargarJugadores(equipoId);
        cargarEquipaciones(equipoId);

    }
);


/* =========================
   CARGAR RIVALES
========================= */

function cargarRivales(equipoId) {

    rivalSelect.innerHTML =
        '<option value="">Selecciona un rival</option>';

    const rivalesEquipo =
        rivales.filter(rival =>
            rival.equipos.includes(equipoId)
        );

    rivalesEquipo.forEach(rival => {

        const option =
            document.createElement("option");

        option.value = rival.id;
        option.textContent = rival.nombre;

        rivalSelect.appendChild(option);

    });
}


/* =========================
   CARGAR JUGADORES
========================= */

function cargarJugadores(equipoId) {

    listaJugadores.innerHTML = "";
    contador.textContent = "0";

    const equipo =
        equipos.find(e =>
            e.id === equipoId
        );

    if (!equipo) {
        return;
    }

    equipo.jugadores.forEach(
        (jugador, index) => {

            const posiciones =
                jugador.posiciones
                    .filter(posicion => posicion)
                    .join(" · ");

            const div =
                document.createElement("label");

            div.className = "jugador";

            div.innerHTML = `

                <input
                    type="checkbox"
                    class="jugador-checkbox"
                    value="${index}"
                >

                <div class="datos-jugador">

                    <span class="nombre-jugador">
                        ${jugador.dorsal}. ${jugador.nombre}
                    </span>

                    <span class="posiciones">
                        ${posiciones}
                    </span>

                </div>

            `;

            listaJugadores.appendChild(div);

        }
    );


    document
        .querySelectorAll(".jugador-checkbox")
        .forEach(checkbox => {

            checkbox.addEventListener(
                "change",
                actualizarContador
            );

        });

}


/* =========================
   CONTADOR
========================= */

function actualizarContador() {

    const seleccionados =
        document.querySelectorAll(
            ".jugador-checkbox:checked"
        ).length;

    contador.textContent =
        seleccionados;

}


/* =========================
   CARGAR EQUIPACIONES
========================= */

function cargarEquipaciones(equipoId) {

    camisetaSelect.innerHTML = "";
    pantalonSelect.innerHTML = "";
    mediasSelect.innerHTML = "";

    const equipacion =
        equipaciones.find(
            item =>
                item.equipoId === equipoId
        );

    if (!equipacion) {
        return;
    }


    equipacion.camiseta.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.nombre;

        option.textContent =
            item.nombre;

        camisetaSelect.appendChild(option);

    });


    equipacion.pantalon.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.nombre;

        option.textContent =
            item.nombre;

        pantalonSelect.appendChild(option);

    });


    equipacion.medias.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.nombre;

        option.textContent =
            item.nombre;

        mediasSelect.appendChild(option);

    });

}


/* =========================
   TIPO DE PARTIDO
========================= */

tipoPartidoSelect.addEventListener(
    "change",
    () => {

        if (
            tipoPartidoSelect.value ===
            "amistoso"
        ) {

            jornadaInput.disabled = true;

            jornadaInput.value = "";

            jornadaInput.placeholder =
                "No se utiliza en amistoso";

        } else {

            jornadaInput.disabled = false;

            jornadaInput.placeholder =
                "Introduce la jornada";

        }

    }
);


/* =========================
   GENERAR
========================= */

generarButton.addEventListener(
    "click",
    () => {

        const equipoId =
            equipoSelect.value;

        const rivalId =
            rivalSelect.value;

        const tipoPartido =
            tipoPartidoSelect.value;

        const jornada =
            jornadaInput.value;

        const fecha =
            fechaInput.value;

        const campo =
            document.getElementById(
                "campo"
            ).value;

        const lugar =
            document.getElementById(
                "lugar"
            ).value;

        const localVisitante =
            localVisitanteSelect.value;


        if (!equipoId) {

            alert(
                "Selecciona un equipo."
            );

            return;
        }


        if (!rivalId) {

            alert(
                "Selecciona un rival."
            );

            return;
        }


        if (
            tipoPartido === "oficial" &&
            !jornada
        ) {

            alert(
                "Introduce la jornada."
            );

            return;
        }


        if (!fecha) {

            alert(
                "Selecciona la fecha."
            );

            return;
        }


        const equipo =
            equipos.find(
                item =>
                    item.id === equipoId
            );


        const rival =
            rivales.find(
                item =>
                    item.id === rivalId
            );


        if (!equipo || !rival) {

            alert(
                "No se han podido cargar los datos del partido."
            );

            return;
        }


        const seleccionados =
            Array.from(
                document.querySelectorAll(
                    ".jugador-checkbox:checked"
                )
            ).map(checkbox =>
                equipo.jugadores[
                    Number(checkbox.value)
                ]
            );


        /*
        TEMPORALMENTE NO SE EXIGEN 18.
        */

        if (
            seleccionados.length === 0
        ) {

            alert(
                "Selecciona al menos un jugador."
            );

            return;
        }


        /*
        =========================
        EQUIPACIÓN SELECCIONADA
        =========================
        */

        const datosEquipacion =
            equipaciones.find(
                item =>
                    item.equipoId === equipoId
            );


        const camiseta =
            datosEquipacion.camiseta.find(
                item =>
                    item.nombre ===
                    camisetaSelect.value
            );


        const pantalon =
            datosEquipacion.pantalon.find(
                item =>
                    item.nombre ===
                    pantalonSelect.value
            );


        const medias =
            datosEquipacion.medias.find(
                item =>
                    item.nombre ===
                    mediasSelect.value
            );


        /*
        =========================
        EQUIPOS
        =========================
        */

        const equipoLasRozas = {

            nombre: "Las Rozas",

            escudo:
                "escudos/Las_Rozas.png"

        };


        let equipoIzquierda;
        let equipoDerecha;


        if (
            localVisitante ===
            "local"
        ) {

            equipoIzquierda =
                equipoLasRozas;

            equipoDerecha =
                rival;

        } else {

            equipoIzquierda =
                rival;

            equipoDerecha =
                equipoLasRozas;

        }


        /*
        =========================
        FECHA
        =========================
        */

        const fechaFormateada =
            new Date(
                fecha + "T00:00:00"
            ).toLocaleDateString(
                "es-ES"
            );


        /*
        =========================
        JORNADA
        =========================
        */

        const jornadaTexto =
            tipoPartido === "amistoso"
                ? "Amistoso"
                : `Jornada ${jornada}`;


        /*
        =========================
        CAMPO + LUGAR
        =========================
        */

        const campoLugar =
            lugar
                ? `${campo} (${lugar})`
                : campo;


        /*
        =========================
        JUGADORES
        =========================
        */

        const jugadoresHTML =
            seleccionados
                .map(jugador => {

                    const posiciones =
                        jugador.posiciones
                            .filter(
                                posicion =>
                                    posicion
                            )
                            .join(" · ");


                    return `

                        <div class="jugador-resultado">

                            <div class="dorsal">
                                ${jugador.dorsal}
                            </div>

                            <div>

                                <div class="nombre-resultado">
                                    ${jugador.nombre}
                                </div>

                                <div class="posiciones-resultado">
                                    ${posiciones}
                                </div>

                            </div>

                        </div>

                    `;

                })
                .join("");


        /*
        =========================
        CUERPO TÉCNICO
        =========================
        */

        const staffHTML = [];


        if (equipo.entrenador) {

            staffHTML.push(`

                <div class="tecnico">

                    <strong>
                        Entrenador:
                    </strong>

                    ${equipo.entrenador}

                </div>

            `);

        }


        if (
            equipo.cuerpoTecnico &&
            equipo.cuerpoTecnico.length > 0
        ) {

            equipo.cuerpoTecnico.forEach(
                persona => {

                    staffHTML.push(`

                        <div class="tecnico">
                            ${persona}
                        </div>

                    `);

                }
            );

        }


        /*
        =========================
        HTML EQUIPACIÓN
        =========================
        */

        const equipacionHTML = `

            <div class="equipacion-resultado">

                <div class="equipacion-titulo">
                    EQUIPACIÓN
                </div>

                <div class="equipacion-visual">

                    <div class="pieza-equipacion">

                        <img
                            src="${camiseta.imagen}"
                            alt="Camiseta ${camiseta.nombre}"
                        >

                        <div class="pieza-nombre">
                            Camiseta ${camiseta.nombre}
                        </div>

                    </div>


                    <div class="pieza-equipacion">

                        <img
                            src="${pantalon.imagen}"
                            alt="Pantalón ${pantalon.nombre}"
                        >

                        <div class="pieza-nombre">
                            Pantalón ${pantalon.nombre}
                        </div>

                    </div>


                    <div class="pieza-equipacion">

                        <img
                            src="${medias.imagen}"
                            alt="Medias ${medias.nombre}"
                        >

                        <div class="pieza-nombre">
                            Medias ${medias.nombre}
                        </div>

                    </div>

                </div>

            </div>

        `;


        /*
        =========================
        RESULTADO
        =========================
        */

        resultado.innerHTML = `

            <div class="convocatoria">


                <div class="cabecera">

                    <div class="cabecera-titulo">
                        CONVOCATORIA
                    </div>

                    <div class="jornada">
                        ${jornadaTexto}
                    </div>

                </div>


                <div class="equipos">


                    <div class="equipo">

                        <img
                            src="${equipoIzquierda.escudo}"
                            alt="${equipoIzquierda.nombre}"
                        >

                        ${equipoIzquierda.nombre}

                    </div>


                    <div class="vs">
                        VS
                    </div>


                    <div class="equipo">

                        <img
                            src="${equipoDerecha.escudo}"
                            alt="${equipoDerecha.nombre}"
                        >

                        ${equipoDerecha.nombre}

                    </div>


                </div>


                <div class="datos-partido">

                    <div>
                        <strong>
                            ${fechaFormateada}
                        </strong>
                    </div>

                    <div>
                        ${campoLugar}
                    </div>

                </div>


                ${equipacionHTML}


                <div class="jugadores-resultado">

                    <h3>
                        JUGADORES CONVOCADOS
                        (${seleccionados.length})
                    </h3>

                    <div class="lista-jugadores">

                        ${jugadoresHTML}

                    </div>

                </div>


                <div class="cuerpo-tecnico">

                    <h3>
                        CUERPO TÉCNICO
                    </h3>

                    ${staffHTML.join("")}

                </div>


                <div class="pie">
                    LAS ROZAS
                </div>


            </div>

        `;


        resultado.style.display =
            "block";


        resultado.scrollIntoView({
            behavior: "smooth"
        });

    }
);

</script>

</body>
</html>
